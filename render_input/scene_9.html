<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Great Jewish Revolt - 66 CE</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #090a0f;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
  }
  #viewport {
    position: relative;
    width: 1280px;
    height: 720px;
    background: #000;
    overflow: hidden;
    box-shadow: 0 0 50px rgba(0,0,0,0.9);
  }
  svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 1280px;
    height: 720px;
  }
  canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 1280px;
    height: 720px;
    pointer-events: none;
  }

  /* Articulated Limb Rigging (Absolute Joint Origins) */
  .walk-leg-l { transform-origin: 28px 58px; animation: legL 0.65s infinite alternate ease-in-out; }
  .walk-leg-r { transform-origin: 50px 58px; animation: legR 0.65s infinite alternate ease-in-out; }
  .walk-arm-l { transform-origin: 22px 32px; animation: armL 0.65s infinite alternate ease-in-out; }
  .walk-arm-r { transform-origin: 54px 32px; animation: armR 0.65s infinite alternate ease-in-out; }
  .char-bob   { animation: bob 0.325s infinite alternate ease-in-out; }

  @keyframes legL { from { transform: rotate(-22deg); } to { transform: rotate(22deg); } }
  @keyframes legR { from { transform: rotate(22deg); } to { transform: rotate(-22deg); } }
  @keyframes armL { from { transform: rotate(25deg); } to { transform: rotate(-25deg); } }
  @keyframes armR { from { transform: rotate(-25deg); } to { transform: rotate(25deg); } }
  @keyframes bob  { from { transform: translateY(0px); } to { transform: translateY(-3.5px); } }

  /* Sword & Menorah Rigging */
  .rebel-sword-arm { transform-origin: 54px 32px; animation: swordSlash 0.5s infinite alternate ease-in-out; }
  @keyframes swordSlash { from { transform: rotate(15deg); } to { transform: rotate(-55deg); } }

  .looter-arm-r { transform-origin: 54px 32px; animation: lootCarry 0.8s infinite alternate ease-in-out; }
  @keyframes lootCarry { from { transform: rotate(-25deg); } to { transform: rotate(-10deg); } }

  .flag-wave { transform-origin: 0px 40px; animation: fWave 1.2s infinite alternate ease-in-out; }
  @keyframes fWave { from { transform: skewY(-3deg) scaleX(0.97); } to { transform: skewY(4deg) scaleX(1.02); } }

  .text-label {
    font-family: 'Impact', 'Arial Black', sans-serif;
    text-shadow: 3px 3px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 0 4px 12px rgba(0,0,0,0.85);
    letter-spacing: 1px;
  }
</style>
</head>
<body>

<div id="viewport">
  <svg id="stage" viewBox="0 0 1280 720">
    <defs>
      <!-- Gradients -->
      <linearGradient id="templeGoldSky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#78350f"/>
        <stop offset="50%" stop-color="#b45309"/>
        <stop offset="100%" stop-color="#fef08a"/>
      </linearGradient>
      <linearGradient id="fireSky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#450a0a"/>
        <stop offset="45%" stop-color="#b91c1c"/>
        <stop offset="100%" stop-color="#f59e0b"/>
      </linearGradient>
      <linearGradient id="victorySky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#0369a1"/>
        <stop offset="60%" stop-color="#38bdf8"/>
        <stop offset="100%" stop-color="#f0fdf4"/>
      </linearGradient>
      <linearGradient id="romeWrathSky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#0f172a"/>
        <stop offset="50%" stop-color="#1e1b4b"/>
        <stop offset="100%" stop-color="#7f1d1d"/>
      </linearGradient>
      <linearGradient id="goldTreasure" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#fef08a"/>
        <stop offset="50%" stop-color="#facc15"/>
        <stop offset="100%" stop-color="#ca8a04"/>
      </linearGradient>
    </defs>

    <g id="camera-root">
      <!-- ================= SCENE 0: [0.0s - 5.2s] STOLE SACRED TEMPLE TREASURES ================= -->
      <!-- Timed: [0.0-2.0s] stole sacred treasures to pay debts, [2.0-2.8s] Wow, [2.8-5.2s] you just don't do that -->
      <g class="scene" id="scene-0">
        <rect x="-100" y="-100" width="1480" height="920" fill="url(#templeGoldSky)"/>
        <!-- Interior Sanctuary Columns & Veil -->
        <g transform="translate(180, 220)">
          <rect x="0" y="0" width="920" height="340" fill="#292524" stroke="#ca8a04" stroke-width="4"/>
          <line x1="160" y1="0" x2="160" y2="340" stroke="#ca8a04" stroke-width="8"/>
          <line x1="760" y1="0" x2="760" y2="340" stroke="#ca8a04" stroke-width="8"/>
        </g>
        <path d="M-80,560 L1380,560 L1380,750 L-80,750 Z" fill="#1c1917"/>

        <!-- The Holy Golden Menorah Plundered on a Palanquin -->
        <g id="plundered-menorah" transform="translate(740, 380)">
          <path d="M-40,60 Q-40,10 0,10 Q40,10 40,60 M-20,60 Q-20,25 0,25 Q20,25 20,60 M0,0 L0,80" fill="none" stroke="url(#goldTreasure)" stroke-width="8" stroke-linecap="round"/>
          <rect x="-30" y="80" width="60" height="15" fill="#ca8a04"/>
          <!-- Treasure bags & Talents of Silver -->
          <circle cx="-50" cy="80" r="14" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2"/>
          <circle cx="50" cy="80" r="14" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2"/>
          <rect x="-80" y="95" width="160" height="14" rx="4" fill="#78350f"/>
        </g>

        <!-- Roman Looter Soldier Escaping with Plunder -->
        <g class="char-bob" transform="translate(520, 390) scale(1.35)">
          <g class="walk-leg-l">
            <rect x="24" y="58" width="13" height="48" rx="4" fill="#fed7aa"/>
            <rect x="20" y="98" width="22" height="10" rx="3" fill="#78350f"/>
          </g>
          <g class="walk-leg-r">
            <rect x="44" y="58" width="13" height="48" rx="4" fill="#fed7aa"/>
            <rect x="40" y="98" width="22" height="10" rx="3" fill="#78350f"/>
          </g>
          <rect x="20" y="24" width="38" height="40" rx="6" fill="#991b1b"/>
          <rect x="20" y="28" width="38" height="26" rx="4" fill="#94a3b8"/>
          <circle cx="39" cy="12" r="14" fill="#fed7aa"/>
          <circle cx="44" cy="11" r="2.5" fill="#0f172a"/>
          <path d="M24,8 Q39,-8 54,8 L56,16 L22,16 Z" fill="#ca8a04"/>
          <g class="looter-arm-r">
            <rect x="48" y="24" width="12" height="30" rx="4" fill="#991b1b"/>
            <!-- Stolen Temple Vessel (Golden Flagon) -->
            <path d="M52,44 Q65,40 65,65 L48,65 Z" fill="#facc15" stroke="#ca8a04"/>
          </g>
          <g class="walk-arm-l">
            <rect x="16" y="24" width="12" height="30" rx="4" fill="#991b1b"/>
          </g>
        </g>

        <!-- Titles -->
        <g transform="translate(640, 105)">
          <rect x="-330" y="-45" width="660" height="90" rx="16" fill="#000" opacity="0.85" stroke="#ef4444" stroke-width="2"/>
          <text class="text-label" x="0" y="2" text-anchor="middle" fill="#facc15" font-size="38">LOOTING THE SACRED TREASURY</text>
          <text class="text-label" x="0" y="34" text-anchor="middle" fill="#ef4444" font-size="20">17 TALENTS STOLEN BY GOVERNOR FLORUS</text>
        </g>
      </g>

      <!-- ================= SCENE 1: [5.2s - 11.4s] 66 CE: THE PEOPLE SNAPPED & REBELLED ================= -->
      <!-- Timed: [5.2-8.2s] 66 CE Jewish people finally snapped, [8.2-11.4s] launched massive coordinated rebellion -->
      <g class="scene" id="scene-1">
        <rect x="-100" y="-100" width="1480" height="920" fill="url(#fireSky)"/>
        <!-- City Gates of Jerusalem in Rebellion Flame -->
        <g transform="translate(140, 240)">
          <rect x="0" y="80" width="220" height="280" fill="#78350f"/>
          <rect x="40" y="160" width="140" height="200" rx="70" fill="#1c1917"/>
          <polygon points="0,80 110,0 220,80" fill="#451a03"/>
        </g>
        <!-- Battlements -->
        <path d="M-80,560 L1380,540 L1380,750 L-80,750 Z" fill="#450a0a"/>

        <!-- Armed Zealot Rebel Leader (Eleazar ben Simon) -->
        <g class="char-bob" transform="translate(360, 400) scale(1.35)">
          <g class="walk-leg-l">
            <rect x="24" y="58" width="13" height="46" rx="4" fill="#b45309"/>
            <rect x="20" y="98" width="22" height="10" rx="3" fill="#78350f"/>
          </g>
          <g class="walk-leg-r">
            <rect x="44" y="58" width="13" height="46" rx="4" fill="#b45309"/>
            <rect x="40" y="98" width="22" height="10" rx="3" fill="#78350f"/>
          </g>
          <!-- Deep Blue Judean Tunic with White Sash -->
          <rect x="18" y="24" width="42" height="42" rx="6" fill="#1e3a8a"/>
          <path d="M18,24 L44,24 L32,66 L16,66 Z" fill="#f8fafc"/>
          <!-- Head with Red Rebel Headband -->
          <circle cx="39" cy="12" r="14" fill="#fed7aa"/>
          <rect x="23" y="6" width="32" height="6" rx="2" fill="#dc2626"/>
          <circle cx="44" cy="11" r="2.5" fill="#0f172a"/>
          <!-- Right Arm Slashing Sword -->
          <g class="rebel-sword-arm">
            <rect x="48" y="24" width="12" height="30" rx="4" fill="#1e3a8a"/>
            <line x1="56" y1="46" x2="95" y2="18" stroke="#cbd5e1" stroke-width="4"/>
            <polygon points="95,18 106,10 98,24" fill="#f8fafc"/>
          </g>
          <!-- Left Arm Holding Captured Roman Spear -->
          <g class="walk-arm-l">
            <rect x="14" y="24" width="12" height="30" rx="4" fill="#1e3a8a"/>
            <line x1="20" y1="-30" x2="20" y2="60" stroke="#64748b" stroke-width="3"/>
          </g>
        </g>

        <!-- Coordinated Rebel Uprising Force (JS Seeded Array: 100 figures) -->
        <g id="rebel-army-container"></g>

        <!-- Titles -->
        <g transform="translate(640, 105)">
          <rect x="-310" y="-45" width="620" height="90" rx="16" fill="#000" opacity="0.85" stroke="#ef4444" stroke-width="2"/>
          <text class="text-label" x="0" y="2" text-anchor="middle" fill="#ef4444" font-size="38">66 CE: THE POPULATION SNAPS</text>
          <text class="text-label" x="0" y="34" text-anchor="middle" fill="#fef08a" font-size="20">A MASSIVE COORDINATED REBELLION</text>
        </g>
      </g>

      <!-- ================= SCENE 2: [11.4s - 18.3s] KICKING ROMAN LEGIONS OUT OF THE PROVINCE ================= -->
      <!-- Timed: [11.4-14.0s] against conventional military logic, [14.0-18.3s] managed to kick elite legions out of province -->
      <g class="scene" id="scene-2">
        <rect x="-100" y="-100" width="1480" height="920" fill="url(#fireSky)"/>
        <!-- Battle of Beth Horon Pass: Rugged Canyon Crags -->
        <polygon points="-80,720 180,420 340,540 520,380 680,560 920,410 1140,560 1380,390 1380,750 -80,750" fill="#78350f"/>
        <path d="M-80,620 L1380,600 L1380,750 L-80,750 Z" fill="#451a03"/>

        <!-- Fleeing Roman Legion XII Fulminata (Retreating to Right) -->
        <g id="fleeing-legion" transform="translate(860, 440) scale(1.3)">
          <g class="walk-leg-l">
            <rect x="24" y="58" width="13" height="48" rx="4" fill="#fed7aa"/>
            <rect x="20" y="98" width="22" height="10" rx="3" fill="#78350f"/>
          </g>
          <g class="walk-leg-r">
            <rect x="44" y="58" width="13" height="48" rx="4" fill="#fed7aa"/>
            <rect x="40" y="98" width="22" height="10" rx="3" fill="#78350f"/>
          </g>
          <rect x="20" y="24" width="38" height="40" rx="6" fill="#991b1b"/>
          <rect x="20" y="28" width="38" height="26" rx="4" fill="#94a3b8"/>
          <!-- Turned Head in Panic -->
          <circle cx="39" cy="12" r="14" fill="#fed7aa"/>
          <circle cx="44" cy="11" r="2.5" fill="#0f172a"/>
          <path d="M24,8 Q39,-8 54,8 L56,16 L22,16 Z" fill="#ca8a04"/>
          <!-- Dropping shield in flight -->
          <g transform="translate(60, 48) rotate(45)">
            <rect x="0" y="0" width="22" height="45" rx="4" fill="#dc2626" stroke="#ca8a04"/>
          </g>
        </g>

        <!-- Big Kicking Force Arrow Vector -->
        <g transform="translate(640, 360)">
          <polygon points="-80,-20 80,-20 80,-50 160,0 80,50 80,20 -80,20" fill="#22c55e" stroke="#15803d" stroke-width="4"/>
          <text class="text-label" x="0" y="8" text-anchor="middle" fill="#ffffff" font-size="22">EXPELLED</text>
        </g>

        <!-- Titles -->
        <g transform="translate(640, 105)">
          <rect x="-340" y="-45" width="680" height="90" rx="16" fill="#000" opacity="0.85" stroke="#22c55e" stroke-width="2"/>
          <text class="text-label" x="0" y="2" text-anchor="middle" fill="#22c55e" font-size="38">ELITE LEGIONS EXPELLED</text>
          <text class="text-label" x="0" y="34" text-anchor="middle" fill="#fef08a" font-size="20">DEFEAT OF CESTIUS GALLUS & LEGIO XII</text>
        </g>
      </g>

      <!-- ================= SCENE 3: [18.3s - 21.2s] FOUR YEARS OF INDEPENDENCE (YEAR 1-4 COINS) ================= -->
      <!-- Timed: [18.3-19.3s] For four years, [19.3-21.2s] they were an independent nation again -->
      <g class="scene" id="scene-3">
        <rect x="-100" y="-100" width="1480" height="920" fill="url(#victorySky)"/>
        <!-- Golden Sunburst of Restored Sovereign Judea -->
        <circle cx="640" cy="380" r="300" fill="#fef08a" opacity="0.3"/>
        <circle cx="640" cy="380" r="180" fill="#fef08a" opacity="0.4"/>

        <!-- The Historic Silver Shekel Coin of the Revolt -->
        <g id="revolt-shekel" transform="translate(640, 380)">
          <circle cx="0" cy="0" r="140" fill="#cbd5e1" stroke="#64748b" stroke-width="8"/>
          <circle cx="0" cy="0" r="126" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,6"/>
          <!-- Ancient Paleo-Hebrew Temple Chalice -->
          <path d="M-40,-30 L40,-30 L30,20 Q0,40 -30,20 Z" fill="#94a3b8"/>
          <line x1="-15" y1="28" x2="15" y2="28" stroke="#475569" stroke-width="4"/>
          <line x1="0" y1="28" x2="0" y2="55" stroke="#475569" stroke-width="8"/>
          <rect x="-35" y="55" width="70" height="12" rx="4" fill="#475569"/>
          <!-- Coin Inscription: "Freedom of Zion" -->
          <text class="text-label" x="0" y="-55" text-anchor="middle" fill="#0f172a" font-size="24">SHEKEL OF ISRAEL</text>
          <text class="text-label" x="0" y="100" text-anchor="middle" fill="#1e293b" font-size="20">YEAR 1 TO 4 (66-70 CE)</text>
        </g>

        <!-- Sovereign Flag of Judea Waving -->
        <g class="flag-wave" transform="translate(300, 320)">
          <line x1="0" y1="0" x2="0" y2="240" stroke="#78350f" stroke-width="8"/>
          <rect x="0" y="20" width="120" height="75" fill="#0284c7"/>
          <circle cx="60" cy="57" r="18" fill="#ffffff"/>
          <text class="text-label" x="60" y="64" text-anchor="middle" fill="#0284c7" font-size="16">FREE</text>
        </g>

        <!-- Titles -->
        <g transform="translate(640, 105)">
          <rect x="-310" y="-45" width="620" height="90" rx="16" fill="#000" opacity="0.85" stroke="#38bdf8" stroke-width="2"/>
          <text class="text-label" x="0" y="2" text-anchor="middle" fill="#38bdf8" font-size="38">AN INDEPENDENT NATION AGAIN</text>
          <text class="text-label" x="0" y="34" text-anchor="middle" fill="#facc15" font-size="20">FOUR YEARS OF SOVEREIGN FREEDOM</text>
        </g>
      </g>

      <!-- ================= SCENE 4: [21.2s - 30.0s] ROME NEVER EVER FORGETS (VESPASIAN & TITUS) ================= -->
      <!-- Timed: [21.2-24.6s] problem humiliating Roman Empire, [24.6-28.1s] Roman Empire never forgets, [28.1-30.0s] Never / couldn't let embarrassment -->
      <g class="scene" id="scene-4">
        <rect x="-100" y="-100" width="1480" height="920" fill="url(#romeWrathSky)"/>
        <!-- The Iron Shadow of the Empire: Marching Legions along the Horizon -->
        <path d="M-80,540 L1380,520 L1380,750 L-80,750 Z" fill="#1e293b"/>
        <path d="M-80,620 L1380,600 L1380,750 L-80,750 Z" fill="#0f172a"/>

        <!-- Massive Imperial Gold SPQR Aquila (Roman Eagle) Looming Overhead -->
        <g transform="translate(640, 240)">
          <!-- Giant Aquila Emblem -->
          <circle cx="0" cy="0" r="110" fill="#991b1b" stroke="#facc15" stroke-width="6"/>
          <path d="M-60,30 L0,-40 L60,30 L30,45 L0,15 L-30,45 Z" fill="#facc15"/>
          <text class="text-label" x="0" y="75" text-anchor="middle" fill="#fef08a" font-size="32">S • P • Q • R</text>
        </g>

        <!-- General Vespasian & Titus (Stern Roman Commanders Planning the Return) -->
        <g class="char-bob" transform="translate(640, 450) scale(1.4)">
          <g class="walk-leg-l">
            <rect x="24" y="58" width="13" height="48" rx="4" fill="#fed7aa"/>
            <rect x="20" y="98" width="22" height="10" rx="3" fill="#78350f"/>
          </g>
          <g class="walk-leg-r">
            <rect x="44" y="58" width="13" height="48" rx="4" fill="#fed7aa"/>
            <rect x="40" y="98" width="22" height="10" rx="3" fill="#78350f"/>
          </g>
          <!-- Imperial Gold Muscle Cuirass & Cloak -->
          <path d="M12,24 L18,74 L26,24 Z" fill="#991b1b"/>
          <rect x="20" y="24" width="40" height="42" rx="6" fill="#eab308"/>
          <!-- Severe, Unforgiving Gaze -->
          <circle cx="40" cy="12" r="14" fill="#fed7aa"/>
          <circle cx="45" cy="11" r="2.5" fill="#0f172a"/>
          <path d="M36,6 L50,9" stroke="#000" stroke-width="2.5"/> <!-- Severe brow -->
          <polygon points="24,6 40,-8 56,6" fill="#dc2626"/> <!-- Centurion helmet crest -->
          <!-- Gladius Raised in Cold Vow of Retribution -->
          <g class="rebel-sword-arm">
            <rect x="48" y="24" width="12" height="30" rx="4" fill="#eab308"/>
            <line x1="56" y1="46" x2="94" y2="24" stroke="#cbd5e1" stroke-width="4"/>
          </g>
          <g class="walk-arm-l">
            <rect x="16" y="24" width="12" height="30" rx="4" fill="#eab308"/>
          </g>
        </g>

        <!-- The 4 Legions Marshal (JS Seeded Array in Scene 4) -->
        <g id="rome-counter-army"></g>

        <!-- Final Climax Banner -->
        <g transform="translate(640, 95)">
          <rect x="-340" y="-45" width="680" height="90" rx="16" fill="#000" opacity="0.9" stroke="#ef4444" stroke-width="3"/>
          <text class="text-label" x="0" y="2" text-anchor="middle" fill="#ef4444" font-size="38">ROME NEVER FORGETS</text>
          <text class="text-label" x="0" y="34" text-anchor="middle" fill="#fef08a" font-size="20">60,000 LEGIONARIES DISPATCHED TO CRUSH THE REVOLT</text>
        </g>
      </g>
    </g>
  </svg>

  <!-- Atmospheric Canvas Particles (Sparks, Embers, Smoke) -->
  <canvas id="ambientCanvas" width="1280" height="720"></canvas>
</div>

<script>
  /* ================= Deterministic Workforce & Army Creation (Rule 6 & 8b) ================= */
  let seed = 91823;
  function seededRand() {
    seed = (seed * 9301 + 49297) % 233280;
    return seed / 233280;
  }

  const svgNS = "http://www.w3.org/2000/svg";

  // 1. Populate Scene 1 Rebel Army (100 Jewish rebel fighters)
  const rebelContainer = document.getElementById("rebel-army-container");
  const rebelCount = 100;

  for (let i = 0; i < rebelCount; i++) {
    const row = Math.floor(i / 20);
    const col = i % 20;
    const g = document.createElementNS(svgNS, "g");

    const x = 520 + (col * 35) - (row * 16) + (seededRand() * 6);
    const y = 460 + (row * 28) + (seededRand() * 4);
    const s = 0.44 + (row * 0.09);

    g.setAttribute("transform", `translate(${x}, ${y}) scale(${s})`);

    const head = document.createElementNS(svgNS, "circle");
    head.setAttribute("cx", "0");
    head.setAttribute("cy", "-24");
    head.setAttribute("r", "7");
    head.setAttribute("fill", "#fed7aa");

    const body = document.createElementNS(svgNS, "path");
    const colors = ["#1e3a8a", "#0284c7", "#b45309", "#475569", "#78350f"];
    body.setAttribute("d", "M-10,0 L10,0 L7,-18 L-7,-18 Z");
    body.setAttribute("fill", colors[Math.floor(seededRand() * colors.length)]);

    // Rebel Spear
    const spear = document.createElementNS(svgNS, "line");
    spear.setAttribute("x1", "8");
    spear.setAttribute("y1", "-36");
    spear.setAttribute("x2", "8");
    spear.setAttribute("y2", "10");
    spear.setAttribute("stroke", "#94a3b8");
    spear.setAttribute("stroke-width", "2.5");

    g.appendChild(spear);
    g.appendChild(body);
    g.appendChild(head);
    rebelContainer.appendChild(g);
  }

  // 2. Populate Scene 4 Roman Retaliation Army (120 Legionaries marching back)
  const romeContainer = document.getElementById("rome-counter-army");
  const legionCount = 120;

  for (let i = 0; i < legionCount; i++) {
    const row = Math.floor(i / 24);
    const col = i % 24;
    const g = document.createElementNS(svgNS, "g");

    const isLeft = col < 12;
    const x = isLeft ? 100 + col * 26 : 940 + (col - 12) * 26;
    const y = 490 + (row * 24) + (seededRand() * 4);
    const s = 0.45 + (row * 0.08);

    g.setAttribute("transform", `translate(${x}, ${y}) scale(${s})`);

    const shield = document.createElementNS(svgNS, "rect");
    shield.setAttribute("x", "-7");
    shield.setAttribute("y", "-14");
    shield.setAttribute("width", "14");
    shield.setAttribute("height", "26");
    shield.setAttribute("rx", "3");
    shield.setAttribute("fill", "#dc2626");
    shield.setAttribute("stroke", "#facc15");
    shield.setAttribute("stroke-width", "1.5");

    const helm = document.createElementNS(svgNS, "circle");
    helm.setAttribute("cx", "0");
    helm.setAttribute("cy", "-20");
    helm.setAttribute("r", "5.5");
    helm.setAttribute("fill", "#ca8a04");

    const pilum = document.createElementNS(svgNS, "line");
    pilum.setAttribute("x1", "5");
    pilum.setAttribute("y1", "-34");
    pilum.setAttribute("x2", "5");
    pilum.setAttribute("y2", "12");
    pilum.setAttribute("stroke", "#64748b");
    pilum.setAttribute("stroke-width", "2");

    g.appendChild(pilum);
    g.appendChild(helm);
    g.appendChild(shield);
    romeContainer.appendChild(g);
  }

  /* ================= Atmospheric Canvas Particles ================= */
  const canvas = document.getElementById("ambientCanvas");
  const ctx = canvas.getContext("2d");
  const PARTICLE_COUNT = 75;
  const particles = [];

  for (let i = 0; i < PARTICLE_COUNT; i++) {
    particles.push({
      x: seededRand() * 1280,
      y: seededRand() * 720,
      vx: 0.05 + seededRand() * 0.12,
      vy: -0.04 - seededRand() * 0.08,
      r: 1.2 + seededRand() * 2.2,
      alpha: 0.25 + seededRand() * 0.5
    });
  }

  /* ================= Deterministic Clock Function (Rule 5 & 8) ================= */
  // Merged short sentences into neighbouring scenes across exactly 30.0s (30,000ms):
  // Scene 0: [0.0s - 5.2s]   (0 - 5200ms)     Stole sacred treasures to pay debts
  // Scene 1: [5.2s - 11.4s]  (5200 - 11400ms) 66 CE: Jewish people snapped / massive rebellion
  // Scene 2: [11.4s - 18.3s] (11400 - 18300ms) Kicked elite legions out of province
  // Scene 3: [18.3s - 21.2s] (18300 - 21200ms) For four years, independent nation again
  // Scene 4: [21.2s - 30.0s] (21200 - 30000ms) Problem humiliating Rome: Empire never forgets
  const scenes = [
    { id: "scene-0", start: 0,     end: 5200 },
    { id: "scene-1", start: 5200,  end: 11400 },
    { id: "scene-2", start: 11400, end: 18300 },
    { id: "scene-3", start: 18300, end: 21200 },
    { id: "scene-4", start: 21200, end: 30000 }
  ];

  const cameraRoot = document.getElementById("camera-root");
  const menorah = document.getElementById("plundered-menorah");
  const fleeingLegion = document.getElementById("fleeing-legion");
  const shekel = document.getElementById("revolt-shekel");

  window.updateSceneTime = function(t_ms) {
    const t = Math.max(0, Math.min(30000, t_ms));
    const FADE = 400; // 0.4s clean crossfade

    // 1. Scene Visibility & Cross-fade (Deterministic)
    scenes.forEach(sc => {
      const el = document.getElementById(sc.id);
      if (!el) return;

      if (t < sc.start || t > sc.end) {
        el.style.display = "none";
        el.style.opacity = 0;
      } else {
        el.style.display = "inline";
        let opacity = 1;
        if (t - sc.start < FADE && sc.start !== 0) {
          opacity = (t - sc.start) / FADE;
        } else if (sc.end - t < FADE && sc.end !== 30000) {
          opacity = (sc.end - t) / FADE;
        }
        el.style.opacity = opacity;
      }
    });

    // 2. Slow Cinematic Camera Pan / Zoom across 30 seconds
    const progress = t / 30000;
    const camX = -progress * 46;
    const camY = Math.sin(progress * Math.PI) * -12;
    const camScale = 1.0 + (progress * 0.045);
    cameraRoot.setAttribute("transform", `translate(${camX}, ${camY}) scale(${camScale})`);

    // 3. Scene-Specific Deterministic Actions
    // Scene 0: Menorah being carried away
    if (menorah && t <= 5200) {
      const lootX = 740 + (t / 5200) * 80;
      menorah.setAttribute("transform", `translate(${lootX}, 380)`);
    }

    // Scene 2: Fleeing legion retreating rapidly to the right [11.4s - 18.3s]
    if (fleeingLegion && t >= 11400 && t <= 18300) {
      const fleeProg = (t - 11400) / 6900;
      const fleeX = 860 + fleeProg * 180;
      fleeingLegion.setAttribute("transform", `translate(${fleeX}, 440) scale(1.3)`);
    }

    // Scene 3: Coin rotation shimmer
    if (shekel && t >= 18300 && t <= 21200) {
      const coinT = (t - 18300) * 0.003;
      const scaleX = 1 + Math.sin(coinT) * 0.06;
      shekel.setAttribute("transform", `translate(640, 380) scale(${scaleX}, 1)`);
    }

    // 4. Atmospheric Canvas Particles (Fire sparks, embers, dust)
    ctx.clearRect(0, 0, 1280, 720);
    for (let i = 0; i < PARTICLE_COUNT; i++) {
      const p = particles[i];
      const px = (p.x + t * p.vx) % 1280;
      const py = (p.y + t * p.vy + 720000) % 720;
      const shimmer = Math.sin(t * 0.004 + i) * 1.5;

      // Color changes according to scene (Golden sparks vs Fire embers)
      ctx.fillStyle = (t >= 5200 && t <= 18300) ? "#ef4444" : ((t >= 18300 && t <= 21200) ? "#38bdf8" : "#facc15");
      ctx.globalAlpha = p.alpha * (0.6 + 0.4 * Math.sin(t * 0.003 + i));
      ctx.beginPath();
      ctx.arc(px + shimmer, py, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
  };

  // Initial render at t = 0
  window.updateSceneTime(0);
</script>
</body>
