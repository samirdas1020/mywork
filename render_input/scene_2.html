<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Framework of History - Assimilation vs Survival</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #090a0f;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
  }
  #viewport {
    position: relative;
    width: 1280px;
    height: 720px;
    background: #000;
    overflow: hidden;
    box-shadow: 0 0 50px rgba(0,0,0,0.9);
  }
  svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 1280px;
    height: 720px;
  }
  canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 1280px;
    height: 720px;
    pointer-events: none;
  }

  /* Articulated Limb Rigging (Absolute px joint origins) */
  .arm-l-talk  { transform-origin: 28px 36px; animation: armTalkL 0.8s infinite alternate ease-in-out; }
  .arm-r-point { transform-origin: 56px 36px; animation: armPointR 0.9s infinite alternate ease-in-out; }
  .leg-l-std   { transform-origin: 32px 64px; animation: legShiftL 1.1s infinite alternate ease-in-out; }
  .leg-r-std   { transform-origin: 52px 64px; animation: legShiftR 1.1s infinite alternate ease-in-out; }
  .char-bob    { animation: bobGentle 0.45s infinite alternate ease-in-out; }

  @keyframes armTalkL  { from { transform: rotate(-15deg); } to { transform: rotate(20deg); } }
  @keyframes armPointR { from { transform: rotate(10deg); } to { transform: rotate(-25deg); } }
  @keyframes legShiftL { from { transform: rotate(-3deg); } to { transform: rotate(3deg); } }
  @keyframes legShiftR { from { transform: rotate(3deg); } to { transform: rotate(-3deg); } }
  @keyframes bobGentle { from { transform: translateY(0px); } to { transform: translateY(-3px); } }

  .arm-scroll-l { transform-origin: 26px 36px; animation: scrollL 1.2s infinite alternate ease-in-out; }
  .arm-scroll-r { transform-origin: 58px 36px; animation: scrollR 1.2s infinite alternate ease-in-out; }
  @keyframes scrollL { from { transform: rotate(-8deg); } to { transform: rotate(12deg); } }
  @keyframes scrollR { from { transform: rotate(10deg); } to { transform: rotate(-14deg); } }

  .text-label {
    font-family: 'Impact', 'Arial Black', sans-serif;
    text-shadow: 3px 3px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 0 4px 10px rgba(0,0,0,0.8);

</style>
</head>

<script>
  /* ================= Deterministic Crowd Creation (Rule 6 & 8b) ================= */
  // Seeded pseudo-random generator
  let seed = 44556;
  function seededRand() {
    seed = (seed * 9301 + 49297) % 233280;
    return seed / 233280;
  }

  const svgNS = "http://www.w3.org/2000/svg";

  // 1. Scene 1 Vanishing Figures (Rule 8b - Figures shrink & fade)
  const vanishContainer = document.getElementById("vanishing-people-group");
  const vanishCount = 40;
  const vanishFigures = [];

  for (let i = 0; i < vanishCount; i++) {
    const col = i % 10;
    const row = Math.floor(i / 10);
    const g = document.createElementNS(svgNS, "g");
    const x = -180 + col * 40 + seededRand() * 6;
    const y = -10 + row * 22 + seededRand() * 4;
    g.setAttribute("transform", `translate(${x}, ${y}) scale(0.65)`);

    const head = document.createElementNS(svgNS, "circle");
    head.setAttribute("cx", "0");
    head.setAttribute("cy", "-20");
    head.setAttribute("r", "6");
    head.setAttribute("fill", "#fed7aa");

    const body = document.createElementNS(svgNS, "rect");
    body.setAttribute("x", "-6");
    body.setAttribute("y", "-14");
    body.setAttribute("width", "12");
    body.setAttribute("height", "22");
    body.setAttribute("rx", "3");
    body.setAttribute("fill", "#64748b");

    g.appendChild(head);
    g.appendChild(body);
    vanishContainer.appendChild(g);
    vanishFigures.push(g);
  }

  // 2. Scene 2 Scattering Dispersal Crowd (120 figures scattering outward into empires)
  const scatterContainer = document.getElementById("scattering-crowd-group");
  const scatterCount = 120;
  const scatterFigures = [];

  for (let i = 0; i < scatterCount; i++) {
    const g = document.createElementNS(svgNS, "g");
    // Origin in the center
    const angle = seededRand() * Math.PI * 2;
    const dist = 30 + seededRand() * 380;
    const speed = 0.5 + seededRand() * 1.5;

    const head = document.createElementNS(svgNS, "circle");
    head.setAttribute("cx", "0");
    head.setAttribute("cy", "-18");
    head.setAttribute("r", "5");
    head.setAttribute("fill", "#fed7aa");

    const body = document.createElementNS(svgNS, "path");
    const colors = ["#0284c7", "#ca8a04", "#475569", "#78350f", "#9333ea"];
    body.setAttribute("d", "M-6,0 L6,0 L4,-14 L-4,-14 Z");
    body.setAttribute("fill", colors[Math.floor(seededRand() * colors.length)]);

    g.appendChild(head);
    g.appendChild(body);
    scatterContainer.appendChild(g);

    scatterFigures.push({
      el: g,
      angle: angle,
      baseDist: dist,
      speed: speed
    });
  }

  /* ================= Atmospheric Canvas Particles ================= */
  const canvas = document.getElementById("ambientCanvas");
  const ctx = canvas.getContext("2d");
  const PARTICLE_COUNT = 75;
  const particles = [];

  for (let i = 0; i < PARTICLE_COUNT; i++) {
    particles.push({
      x: seededRand() * 1280,
      y: seededRand() * 720,
      vx: 0.04 + seededRand() * 0.12,
      vy: -0.03 - seededRand() * 0.08,
      r: 1.2 + seededRand() * 2.2,
      alpha: 0.2 + seededRand() * 0.5
    });
  }

  /* ================= Deterministic Clock Function (Rule 5 & 8) ================= */
  // Merged short sentences into neighbouring scenes across exactly 30.0s (30,000ms):
  // Scene 0: [0.0s - 5.3s] (0 - 5300ms) Headlines & Framework of History
  // Scene 1: [5.3s - 11.1s] (5300 - 11100ms) 2,000 Years / Supposed to vanish
  // Scene 2: [11.1s - 19.2s] (11100 - 19200ms) Assimilate, scatter, and fade into empires
  // Scene 3: [19.2s - 23.8s] (19200 - 23800ms) But that didn't happen here (Anomaly)
  // Scene 4: [23.8s - 30.0s] (23800 - 30000ms) Pause & Inspect Historical Records
  const scenes = [
    { id: "scene-0", start: 0,     end: 5300 },
    { id: "scene-1", start: 5300,  end: 11100 },
    { id: "scene-2", start: 11100, end: 19200 },
    { id: "scene-3", start: 19200, end: 23800 },
    { id: "scene-4", start: 23800, end: 30000 }
  ];

  const cameraRoot = document.getElementById("camera-root");

  window.updateSceneTime = function(t_ms) {
    const t = Math.max(0, Math.min(30000, t_ms));
    const FADE = 400; // 0.4s cross-fade

    // 1. Scene Visibility & Cross-fade (Deterministic)
    scenes.forEach(sc => {
      const el = document.getElementById(sc.id);
      if (!el) return;

      if (t < sc.start || t > sc.end) {
        el.style.display = "none";
        el.style.opacity = 0;
      } else {
        el.style.display = "inline";
        let opacity = 1;
        if (t - sc.start < FADE && sc.start !== 0) {
          opacity = (t - sc.start) / FADE;
        } else if (sc.end - t < FADE && sc.end !== 30000) {
          opacity = (sc.end - t) / FADE;
        }
        el.style.opacity = opacity;
      }
    });

    // 2. Slow Cinematic Camera Pan / Zoom across 30 seconds
    const progress = t / 30000;
    const camX = -progress * 45;
    const camY = Math.sin(progress * Math.PI) * -10;
    const camScale = 1.0 + (progress * 0.04);
    cameraRoot.setAttribute("transform", `translate(${camX}, ${camY}) scale(${camScale})`);

    // 3. Scene-Specific Deterministic Animations
    // Scene 1: Vanishing people fade away as 2 millennia pass [7.2s - 11.1s]
    if (t >= 7200 && t <= 11100) {
      const vanishT = (t - 7200) / 3900;
      vanishFigures.forEach((fig, idx) => {
        const threshold = idx / vanishCount;
        if (vanishT > threshold) {
          const fadeProgress = Math.max(0, 1 - (vanishT - threshold) * 3);
          fig.style.opacity = fadeProgress;
        } else {
          fig.style.opacity = 1;
        }
      });
    }

    // Scene 2: Scatter & Assimilate into Empires [11.1s - 19.2s]
    if (t >= 11100 && t <= 19200) {
      const scatterT = (t - 11100) * 0.03;
      scatterFigures.forEach(fig => {
        const r = fig.baseDist + scatterT * fig.speed * 8;
        const x = 640 + Math.cos(fig.angle) * r;
        const y = 480 + Math.sin(fig.angle) * (r * 0.4); // perspective ellipse
        const s = Math.max(0.2, 0.7 - (r / 600) * 0.4);
        const op = Math.max(0.15, 1 - (r / 500));
        fig.el.setAttribute("transform", `translate(${x}, ${y}) scale(${s})`);
        fig.el.style.opacity = op;
      });
    }

    // Scene 4: Main Parchment Scroll Unfurling
    const mainScroll = document.getElementById("main-scroll-group");
    if (mainScroll && t >= 23800) {
      const scrollT = Math.min(1, (t - 23800) / 1400);
      const scaleX = 0.4 + scrollT * 0.6;
      mainScroll.setAttribute("transform", `translate(640, 390) scale(${scaleX}, 1)`);
    }

    // 4. Atmospheric Particles on Canvas
    ctx.clearRect(0, 0, 1280, 720);
    for (let i = 0; i < PARTICLE_COUNT; i++) {
      const p = particles[i];
      const px = (p.x + t * p.vx) % 1280;
      const py = (p.y + t * p.vy + 720000) % 720;
      const shimmer = Math.sin(t * 0.004 + i) * 1.5;

      ctx.fillStyle = (t >= 19200 && t <= 23800) ? "#facc15" : "#38bdf8";
      ctx.globalAlpha = p.alpha * (0.6 + 0.4 * Math.sin(t * 0.003 + i));
      ctx.beginPath();
      ctx.arc(px + shimmer, py, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
  };

  // Initial render at t = 0
  window.updateSceneTime(0);
</script>
</body>
