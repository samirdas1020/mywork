<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>The Roman Siege Ramp Animation</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d0907;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #stage-container {
      position: relative;
      width: 1280px;
      height: 720px;
      background: #000;
      overflow: hidden;
    }
    #svg-stage {
      position: absolute;
      top: 0;
      left: 0;
      width: 1280px;
      height: 720px;
      transform-origin: 50% 50%;
    }
    #canvas-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 1280px;
      height: 720px;
      pointer-events: none;
      z-index: 10;
    }

    /* Rigging: Limb transforms */
    .arm-l, .arm-r, .leg-l, .leg-r, .head-node {
      transform-box: fill-box;
      transform-origin: top center;
    }
    .head-node {
      transform-origin: bottom center;
    }

    /* Keyframes for rigging */
    @keyframes legWalkA {
      0% { transform: rotate(-24deg); }
      100% { transform: rotate(24deg); }
    }
    @keyframes legWalkB {
      0% { transform: rotate(24deg); }
      100% { transform: rotate(-24deg); }
    }
    @keyframes armSwingA {
      0% { transform: rotate(25deg); }
      100% { transform: rotate(-25deg); }
    }
    @keyframes armSwingB {
      0% { transform: rotate(-20deg); }
      100% { transform: rotate(20deg); }
    }
    @keyframes torsoBob {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
      100% { transform: translateY(0px); }
    }
    @keyframes headNod {
      0% { transform: rotate(-3deg); }
      100% { transform: rotate(3deg); }
    }
    @keyframes flagWave {
      0% { transform: skewY(0deg) scaleX(1); }
      100% { transform: skewY(4deg) scaleX(0.96); }
    }
    @keyframes swordGesture {
      0% { transform: rotate(-10deg); }
      100% { transform: rotate(-40deg); }
    }

    .anim-leg-l { animation: legWalkA 0.75s infinite alternate ease-in-out; }
    .anim-leg-r { animation: legWalkB 0.75s infinite alternate ease-in-out; }
    .anim-arm-l { animation: armSwingA 0.75s infinite alternate ease-in-out; }
    .anim-arm-r { animation: armSwingB 0.75s infinite alternate ease-in-out; }
    .anim-bob   { animation: torsoBob 0.75s infinite ease-in-out; }
    .anim-head  { animation: headNod 1.5s infinite alternate ease-in-out; }
    .anim-flag  { animation: flagWave 1.2s infinite alternate ease-in-out; transform-box: fill-box; transform-origin: left center; }
    .anim-sword { animation: swordGesture 1.6s infinite alternate ease-in-out; }

    .scene {
      opacity: 0;
      
    }
  </style>
</head>
<body>

<div id="stage-container">
  <svg id="svg-stage" viewBox="0 0 1280 720">
    <defs>
      <!-- Gradients -->
      <linearGradient id="skyScorching" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#e65100"/>
        <stop offset="40%" stop-color="#f57c00"/>
        <stop offset="75%" stop-color="#ffb74d"/>
        <stop offset="100%" stop-color="#ffe0b2"/>
      </linearGradient>

      <linearGradient id="skyEvening" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#bf360c"/>
        <stop offset="50%" stop-color="#e64a19"/>
        <stop offset="85%" stop-color="#ff8a65"/>
        <stop offset="100%" stop-color="#ffccbc"/>
      </linearGradient>

      <linearGradient id="skyHazy" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#ff8f00"/>
        <stop offset="60%" stop-color="#ffca28"/>
        <stop offset="100%" stop-color="#fff8e1"/>
      </linearGradient>

      <linearGradient id="goldHelm" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#ffd54f"/>
        <stop offset="60%" stop-color="#ffb300"/>
        <stop offset="100%" stop-color="#ff8f00"/>
      </linearGradient>

      <linearGradient id="romanArmor" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#d32f2f"/>
        <stop offset="70%" stop-color="#b71c1c"/>
        <stop offset="100%" stop-color="#7f0000"/>
      </linearGradient>

      <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="40%" stop-color="#fff59d"/>
        <stop offset="75%" stop-color="#ffb74d" stop-opacity="0.6"/>
        <stop offset="100%" stop-color="#ff9800" stop-opacity="0"/>
      </radialGradient>
    </defs>

    <!-- ================= SCENE 1: PODCAST INTRO & SCORCHING DESERT ================= -->
    <g class="scene" id="scene-1">
      <rect width="1280" height="720" fill="url(#skyScorching)"/>
      <circle cx="1080" cy="180" r="140" fill="url(#sunGlow)"/>
      <circle cx="1080" cy="180" r="45" fill="#ffffff"/>

      <!-- Distant desert dunes -->
      <path d="M-40,510 Q240,400 560,490 T1320,470 L1320,720 L-40,720 Z" fill="#d87a28"/>
      <path d="M-20,560 Q380,480 780,560 T1300,530 L1300,720 L-20,720 Z" fill="#bf6018"/>
      <rect x="0" y="600" width="1280" height="120" fill="#a44b0c"/>

      <!-- Host Character 1 (Left) -->
      <g id="s1-host1" transform="translate(240, 360)">
        <ellipse cx="60" cy="245" rx="50" ry="12" fill="rgba(80,20,5,0.4)"/>
        <!-- Left Leg -->
        <g class="leg-l anim-leg-l" style="transform-origin: 45px 145px;">
          <rect x="38" y="145" width="14" height="95" rx="6" fill="#3e2723"/>
          <rect x="34" y="230" width="26" height="15" rx="5" fill="#212121"/>
        </g>
        <!-- Right Leg -->
        <g class="leg-r anim-leg-r" style="transform-origin: 75px 145px;">
          <rect x="68" y="145" width="14" height="95" rx="6" fill="#3e2723"/>
          <rect x="64" y="230" width="26" height="15" rx="5" fill="#212121"/>
        </g>
        <!-- Bobbing Body -->
        <g class="anim-bob">
          <!-- Torso / Tunic -->
          <rect x="30" y="65" width="60" height="85" rx="14" fill="#0277bd"/>
          <polygon points="50,65 70,65 65,95 55,95" fill="#e1f5fe"/>
          <!-- Arm Left (Microphone) -->
          <g class="arm-l anim-arm-l" style="transform-origin: 32px 75px;">
            <rect x="22" y="75" width="14" height="50" rx="6" fill="#0277bd"/>
            <rect x="18" y="115" width="12" height="30" rx="5" fill="#e0a96d"/>
            <!-- Mic -->
            <rect x="14" y="138" width="16" height="24" rx="6" fill="#37474f"/>
            <line x1="22" y1="162" x2="22" y2="180" stroke="#212121" stroke-width="3"/>
          </g>
          <!-- Arm Right -->
          <g class="arm-r anim-arm-r" style="transform-origin: 88px 75px;">
            <rect x="84" y="75" width="14" height="52" rx="6" fill="#0277bd"/>
            <circle cx="91" cy="132" r="8" fill="#e0a96d"/>
          </g>
          <!-- Head -->
          <g class="head-node anim-head" style="transform-origin: 60px 65px;">
            <ellipse cx="60" cy="38" rx="22" ry="24" fill="#e0a96d"/>
            <!-- Hair -->
            <path d="M38,32 C38,12 82,12 82,32 Q78,20 60,20 Q42,20 38,32 Z" fill="#422513"/>
            <!-- Headphones -->
            <path d="M36,36 C36,10 84,10 84,36" stroke="#212121" stroke-width="6" fill="none"/>
            <rect x="32" y="30" width="10" height="20" rx="4" fill="#ffb300"/>
            <rect x="78" y="30" width="10" height="20" rx="4" fill="#ffb300"/>
            <!-- Face -->
            <circle cx="68" cy="36" r="3.5" fill="#212121"/>
            <circle cx="54" cy="36" r="3.5" fill="#212121"/>
            <path d="M56,48 Q61,54 67,48" stroke="#795548" stroke-width="2.5" fill="none" stroke-linecap="round"/>
          </g>
        </g>
      </g>

      <!-- Host Character 2 (Right) -->
      <g id="s1-host2" transform="translate(860, 360)">
        <ellipse cx="60" cy="245" rx="50" ry="12" fill="rgba(80,20,5,0.4)"/>
        <!-- Left Leg -->
        <g class="leg-l anim-leg-r" style="transform-origin: 45px 145px;">
          <rect x="38" y="145" width="14" height="95" rx="6" fill="#263238"/>
          <rect x="34" y="230" width="26" height="15" rx="5" fill="#cfd8dc"/>
        </g>
        <!-- Right Leg -->
        <g class="leg-r anim-leg-l" style="transform-origin: 75px 145px;">
          <rect x="68" y="145" width="14" height="95" rx="6" fill="#263238"/>
          <rect x="64" y="230" width="26" height="15" rx="5" fill="#cfd8dc"/>
        </g>
        <!-- Body -->
        <g class="anim-bob">
          <rect x="30" y="65" width="60" height="85" rx="14" fill="#2e7d32"/>
          <g class="arm-l anim-arm-r" style="transform-origin: 32px 75px;">
            <rect x="22" y="75" width="14" height="52" rx="6" fill="#2e7d32"/>
            <circle cx="28" cy="132" r="8" fill="#ffcc80"/>
          </g>
          <g class="arm-r anim-arm-l" style="transform-origin: 88px 75px;">
            <rect x="84" y="75" width="14" height="50" rx="6" fill="#2e7d32"/>
            <rect x="90" y="115" width="12" height="30" rx="5" fill="#ffcc80"/>
            <rect x="88" y="138" width="16" height="24" rx="6" fill="#37474f"/>
          </g>
          <g class="head-node anim-head" style="transform-origin: 60px 65px;">
            <ellipse cx="60" cy="38" rx="22" ry="24" fill="#ffcc80"/>
            <path d="M38,30 C36,14 84,14 82,30 Q74,18 60,20 Q44,18 38,30 Z" fill="#212121"/>
            <path d="M36,36 C36,10 84,10 84,36" stroke="#d32f2f" stroke-width="6" fill="none"/>
            <rect x="32" y="30" width="10" height="20" rx="4" fill="#d32f2f"/>
            <rect x="78" y="30" width="10" height="20" rx="4" fill="#d32f2f"/>
            <circle cx="52" cy="36" r="3.5" fill="#212121"/>
            <circle cx="66" cy="36" r="3.5" fill="#212121"/>
            <path d="M54,48 Q60,54 66,48" stroke="#795548" stroke-width="2.5" fill="none" stroke-linecap="round"/>
          </g>
        </g>
      </g>
    </g>

    <!-- ================= SCENE 2: THE 2000-YR OLD GIANT DIRT RAMP ================= -->
    <g class="scene" id="scene-2">
      <rect width="1280" height="720" fill="url(#skyHazy)"/>
      <circle cx="280" cy="150" r="80" fill="url(#sunGlow)"/>

      <!-- Distant Judaean Mountains -->
      <polygon points="0,480 280,340 580,450 890,320 1280,440 1280,720 0,720" fill="#d78438" opacity="0.6"/>
      <polygon points="0,520 340,410 740,510 1100,380 1280,480 1280,720 0,720" fill="#ba6324" opacity="0.8"/>

      <!-- Masada Rock Mountain Fortress -->
      <polygon points="760,180 1280,180 1280,640 680,640" fill="#8d3d19"/>
      <!-- Fortress wall & towers atop -->
      <rect x="760" y="152" width="520" height="28" fill="#ab572d"/>
      <rect x="800" y="132" width="40" height="20" fill="#ab572d"/>
      <rect x="940" y="132" width="40" height="20" fill="#ab572d"/>
      <rect x="1100" y="132" width="40" height="20" fill="#ab572d"/>

      <!-- The Massive Imposing Dirt Ramp Structure -->
      <polygon points="120,640 820,230 920,230 940,640" fill="#cf7a34"/>
      <!-- Timber Cribbing Logs Bracing The Earth Ramp -->
      <g stroke="#5d2806" stroke-width="5" opacity="0.8">
        <line x1="280" y1="560" x2="350" y2="520"/>
        <line x1="420" y1="480" x2="500" y2="440"/>
        <line x1="580" y1="390" x2="660" y2="350"/>
        <line x1="720" y1="300" x2="800" y2="260"/>
        <line x1="290" y1="520" x2="340" y2="570"/>
        <line x1="430" y1="440" x2="490" y2="490"/>
        <line x1="590" y1="350" x2="650" y2="400"/>
      </g>
      <!-- Ramp slope path highlight -->
      <line x1="120" y1="638" x2="825" y2="228" stroke="#ffd180" stroke-width="8"/>
      <rect x="0" y="640" width="1280" height="80" fill="#7a320d"/>

      <!-- Roman Engineer / Inspecting Centurion in Foreground -->
      <g id="s2-centurion" transform="translate(180, 440)">
        <ellipse cx="45" cy="200" rx="40" ry="10" fill="rgba(60,20,5,0.45)"/>
        <!-- Legs -->
        <g class="leg-l" style="transform-origin: 30px 120px;">
          <rect x="24" y="120" width="14" height="78" rx="5" fill="#d79a6b"/>
          <rect x="20" y="185" width="24" height="15" rx="4" fill="#4e2711"/>
        </g>
        <g class="leg-r" style="transform-origin: 58px 120px;">
          <rect x="52" y="120" width="14" height="78" rx="5" fill="#d79a6b"/>
          <rect x="48" y="185" width="24" height="15" rx="4" fill="#4e2711"/>
        </g>
        <!-- Body -->
        <g class="anim-bob">
          <path d="M15,48 L75,48 L80,125 L10,125 Z" fill="url(#romanArmor)"/>
          <!-- Arm holding parchment scroll -->
          <g class="arm-l" style="transform-origin: 18px 55px;">
            <rect x="10" y="55" width="14" height="48" rx="5" fill="#d79a6b"/>
            <!-- Rolled Scroll -->
            <rect x="2" y="96" width="24" height="12" rx="4" fill="#fff8e1" stroke="#8d6e63" stroke-width="2"/>
          </g>
          <!-- Arm pointing up at the ramp -->
          <g class="arm-r anim-sword" style="transform-origin: 72px 55px;">
            <rect x="68" y="55" width="14" height="50" rx="5" fill="#d79a6b"/>
            <circle cx="75" cy="110" r="8" fill="#d79a6b"/>
            <!-- Wooden Baton of Command -->
            <rect x="71" y="90" width="8" height="42" rx="3" fill="#ffb300" stroke="#b57c00" stroke-width="1.5"/>
          </g>
          <!-- Head with Centurion Crest -->
          <g class="head-node anim-head" style="transform-origin: 45px 48px;">
            <ellipse cx="45" cy="24" rx="18" ry="20" fill="#d79a6b"/>
            <!-- Helmet -->
            <path d="M26,20 C26,0 64,0 64,20 Z" fill="url(#goldHelm)"/>
            <rect x="22" y="18" width="46" height="6" rx="2" fill="#ffb300"/>
            <path d="M20,6 Q45,-8 70,6" stroke="#b71c1c" stroke-width="8" fill="none" stroke-linecap="round"/>
            <!-- Face -->
            <circle cx="52" cy="22" r="3" fill="#212121"/>
            <path d="M46,34 Q53,38 60,34" stroke="#5d4037" stroke-width="2" fill="none"/>
          </g>
        </g>
      </g>
    </g>

    <!-- ================= SCENE 3: ROMAN SOLDIERS BUCKET BY BUCKET ================= -->
    <g class="scene" id="scene-3">
      <rect width="1280" height="720" fill="url(#skyEvening)"/>
      <circle cx="640" cy="120" r="60" fill="url(#sunGlow)"/>

      <!-- Camp Ground & Earth Mound -->
      <polygon points="0,520 420,440 860,540 1280,480 1280,720 0,720" fill="#a44618"/>
      <rect x="0" y="580" width="1280" height="140" fill="#752a08"/>

      <!-- Roman SPQR Standard in Background -->
      <g transform="translate(620, 240)">
        <rect x="18" y="0" width="6" height="340" fill="#5d4037"/>
        <g class="anim-flag">
          <rect x="24" y="20" width="90" height="60" fill="#b71c1c"/>
          <text x="69" y="56" fill="#ffd54f" font-size="18" font-weight="bold" text-anchor="middle" font-family="sans-serif">SPQR</text>
        </g>
        <circle cx="21" cy="0" r="14" fill="url(#goldHelm)"/>
      </g>

      <!-- Worker Soldier 1 (Carrying heavy dirt bucket - Moving across ground) -->
      <g id="s3-soldier1" transform="translate(260, 360)">
        <ellipse cx="45" cy="225" rx="35" ry="10" fill="rgba(60,20,5,0.4)"/>
        <!-- Left Leg -->
        <g class="leg-l anim-leg-l" style="transform-origin: 32px 135px;">
          <rect x="26" y="135" width="12" height="85" rx="5" fill="#e0a96d"/>
          <path d="M22,210 L44,210 L44,222 L22,222 Z" fill="#3e2723"/>
        </g>
        <!-- Right Leg -->
        <g class="leg-r anim-leg-r" style="transform-origin: 58px 135px;">
          <rect x="52" y="135" width="12" height="85" rx="5" fill="#e0a96d"/>
          <path d="M48,210 L70,210 L70,222 L48,222 Z" fill="#3e2723"/>
        </g>
        <!-- Torso -->
        <g class="anim-bob">
          <path d="M18,60 L72,60 L76,138 L14,138 Z" fill="url(#romanArmor)"/>
          <!-- Arm Left (carrying bucket) -->
          <g class="arm-l anim-arm-l" style="transform-origin: 22px 70px;">
            <rect x="14" y="70" width="14" height="62" rx="6" fill="#e0a96d"/>
            <circle cx="21" cy="135" r="7" fill="#e0a96d"/>
            <!-- Bucket -->
            <path d="M8,140 L34,140 L30,175 L12,175 Z" fill="#8d6e63" stroke="#4e342e" stroke-width="2"/>
            <ellipse cx="21" cy="140" rx="13" ry="5" fill="#5d4037"/>
            <line x1="21" y1="135" x2="21" y2="140" stroke="#37474f" stroke-width="2"/>
          </g>
          <!-- Arm Right (swinging) -->
          <g class="arm-r anim-arm-r" style="transform-origin: 68px 70px;">
            <rect x="64" y="70" width="14" height="58" rx="6" fill="#e0a96d"/>
            <circle cx="71" cy="130" r="7" fill="#e0a96d"/>
          </g>
          <!-- Head (straining) -->
          <g class="head-node anim-head" style="transform-origin: 45px 60px;">
            <ellipse cx="45" cy="34" rx="18" ry="20" fill="#e0a96d"/>
            <path d="M26,30 C26,10 64,10 64,30 Z" fill="url(#goldHelm)"/>
            <circle cx="53" cy="34" r="3" fill="#212121"/>
            <path d="M48,46 Q53,42 58,46" stroke="#4e342e" stroke-width="2" fill="none"/>
            <!-- Sweat drop -->
            <path d="M63,28 Q66,32 63,36 Q60,32 63,28 Z" fill="#81d4fa"/>
          </g>
        </g>
      </g>

      <!-- Worker Soldier 2 (Shoveling / Carrying another bucket) -->
      <g id="s3-soldier2" transform="translate(820, 360)">
        <ellipse cx="45" cy="225" rx="35" ry="10" fill="rgba(60,20,5,0.4)"/>
        <g class="leg-l anim-leg-r" style="transform-origin: 32px 135px;">
          <rect x="26" y="135" width="12" height="85" rx="5" fill="#d79a6b"/>
          <path d="M22,210 L44,210 L44,222 L22,222 Z" fill="#3e2723"/>
        </g>
        <g class="leg-r anim-leg-l" style="transform-origin: 58px 135px;">
          <rect x="52" y="135" width="12" height="85" rx="5" fill="#d79a6b"/>
          <path d="M48,210 L70,210 L70,222 L48,222 Z" fill="#3e2723"/>
        </g>
        <g class="anim-bob">
          <path d="M18,60 L72,60 L76,138 L14,138 Z" fill="url(#romanArmor)"/>
          <g class="arm-l anim-arm-r" style="transform-origin: 22px 70px;">
            <rect x="14" y="70" width="14" height="58" rx="6" fill="#d79a6b"/>
            <circle cx="21" cy="130" r="7" fill="#d79a6b"/>
          </g>
          <g class="arm-r anim-arm-l" style="transform-origin: 68px 70px;">
            <rect x="64" y="70" width="14" height="62" rx="6" fill="#d79a6b"/>
            <circle cx="71" cy="135" r="7" fill="#d79a6b"/>
            <!-- Bucket -->
            <path d="M58,140 L84,140 L80,175 L62,175 Z" fill="#8d6e63" stroke="#4e342e" stroke-width="2"/>
            <ellipse cx="71" cy="140" rx="13" ry="5" fill="#5d4037"/>
            <line x1="71" y1="135" x2="71" y2="140" stroke="#37474f" stroke-width="2"/>
          </g>
          <g class="head-node anim-head" style="transform-origin: 45px 60px;">
            <ellipse cx="45" cy="34" rx="18" ry="20" fill="#d79a6b"/>
            <path d="M26,30 C26,10 64,10 64,30 Z" fill="url(#goldHelm)"/>
            <circle cx="39" cy="34" r="3" fill="#212121"/>
            <path d="M34,46 Q39,42 44,46" stroke="#4e342e" stroke-width="2" fill="none"/>
            <path d="M30,28 Q33,32 30,36 Q27,32 30,28 Z" fill="#81d4fa"/>
          </g>
        </g>
      </g>
    </g>

    <!-- ================= SCENE 4: SETTLING A GRUDGE / THE PIECE OF LAND ================= -->
    <g class="scene" id="scene-4">
      <rect width="1280" height="720" fill="url(#skyScorching)"/>
      <circle cx="980" cy="160" r="90" fill="url(#sunGlow)"/>

      <!-- High plateau dramatic overlook -->
      <polygon points="0,380 480,380 620,720 0,720" fill="#6d2b0e"/>
      <polygon points="460,380 1280,520 1280,720 600,720" fill="#541f07"/>

      <!-- Distant Valley & Fortress on Far Horizon -->
      <polygon points="480,420 740,360 920,400 1280,310 1280,530 480,530" fill="#bf5e1f" opacity="0.5"/>
      <rect x="1020" y="280" width="160" height="32" fill="#8d3d19"/>

      <!-- General Flavius Silva (Settling the Grudge) Standing Upright on Cliff -->
      <g id="s4-general" transform="translate(240, 160)">
        <ellipse cx="60" cy="225" rx="50" ry="12" fill="rgba(30,10,3,0.5)"/>
        <!-- Flowing Red Cape -->
        <path class="anim-flag" d="M30,80 Q-10,130 5,210 Q40,200 45,150 Z" fill="#b71c1c"/>
        <!-- Legs -->
        <g class="leg-l" style="transform-origin: 45px 145px;">
          <rect x="38" y="145" width="15" height="78" rx="6" fill="#e0a96d"/>
          <path d="M34,160 L54,160 L52,210 L36,210 Z" fill="url(#goldHelm)"/>
          <rect x="32" y="215" width="25" height="14" rx="4" fill="#3e2723"/>
        </g>
        <g class="leg-r" style="transform-origin: 75px 145px;">
          <rect x="68" y="145" width="15" height="78" rx="6" fill="#e0a96d"/>
          <path d="M64,160 L84,160 L82,210 L66,210 Z" fill="url(#goldHelm)"/>
          <rect x="62" y="215" width="25" height="14" rx="4" fill="#3e2723"/>
        </g>
        <!-- Torso -->
        <g class="anim-bob">
          <path d="M30,70 L90,70 C94,95 92,125 86,145 L34,145 C28,125 26,95 30,70 Z" fill="url(#goldHelm)" stroke="#b57c00" stroke-width="2"/>
          <!-- Arm Left (holding Scutum Shield) -->
          <g class="arm-l" style="transform-origin: 32px 75px;">
            <rect x="22" y="75" width="14" height="52" rx="6" fill="#e0a96d"/>
            <!-- Tower Shield -->
            <rect x="-8" y="90" width="36" height="85" rx="6" fill="#b71c1c" stroke="#ffb300" stroke-width="2"/>
            <circle cx="10" cy="132" r="8" fill="url(#goldHelm)"/>
          </g>
          <!-- Arm Right (Drawn Sword pointing at Masada) -->
          <g class="arm-r anim-sword" style="transform-origin: 88px 75px;">
            <rect x="84" y="75" width="14" height="48" rx="6" fill="#e0a96d"/>
            <circle cx="91" cy="125" r="7" fill="#e0a96d"/>
            <!-- Gladius Sword -->
            <g transform="translate(91, 125) rotate(-35)">
              <rect x="-3" y="0" width="6" height="12" fill="#5d4037"/>
              <rect x="-10" y="12" width="20" height="4" fill="url(#goldHelm)"/>
              <polygon points="-5,16 5,16 4,64 0,74 -4,64" fill="#eceff1" stroke="#90a4ae" stroke-width="1"/>
            </g>
          </g>
          <!-- Expressive Grudging Head -->
          <g class="head-node anim-head" style="transform-origin: 60px 70px;">
            <ellipse cx="60" cy="42" rx="20" ry="22" fill="#e0a96d"/>
            <!-- Helmet & Officer Crest -->
            <path d="M40,36 C40,12 80,12 80,36 Z" fill="url(#goldHelm)"/>
            <path d="M32,20 Q60,0 88,20 Q60,10 32,20 Z" fill="#d32f2f"/>
            <!-- Eyes (determined, stern brow) -->
            <circle cx="68" cy="40" r="3.5" fill="#212121"/>
            <path d="M62,34 L76,38" stroke="#3e2723" stroke-width="2.5" stroke-linecap="round"/>
            <path d="M58,52 Q66,48 72,52" stroke="#5d4037" stroke-width="2.5" fill="none"/>
          </g>
        </g>
      </g>
    </g>
  </svg>

  <!-- Atmospheric Dynamic Canvas Particle Overlay -->
  <canvas id="canvas-overlay" width="1280" height="720"></canvas>
</div>

<script>
  // DOM references
  const svgStage = document.getElementById('svg-stage');
  const canvas = document.getElementById('canvas-overlay');
  const ctx = canvas.getContext('2d');

  const scenes = [
    document.getElementById('scene-1'),
    document.getElementById('scene-2'),
    document.getElementById('scene-3'),
    document.getElementById('scene-4')
  ];

  // 4 Scenes across 30.0s (30,000ms): ~7.5s each with 0.4s cross-fade
  const SCENE_DURATIONS = [
    { start: 0,     end: 7500 },
    { start: 7500,  end: 15000 },
    { start: 15000, end: 22500 },
    { start: 22500, end: 30000 }
  ];

  // Pseudo-random particle seeds created only once at start (per Rule 9)
  const NUM_PARTICLES = 65;
  const particleSeeds = [];
  for (let i = 0; i < NUM_PARTICLES; i++) {
    particleSeeds.push({
      xInit: Math.random() * 1280,
      yInit: Math.random() * 720,
      speedX: 20 + Math.random() * 45,
      speedY: -10 - Math.random() * 20,
      size: 1.5 + Math.random() * 3,
      alpha: 0.2 + Math.random() * 0.5,
      phase: Math.random() * Math.PI * 2,
      isAsh: Math.random() > 0.6
    });
  }

  /**
   * Deterministic Clock Hook (Critical for Renderer)
   * Updates canvas particles, active scenes, camera parallax, and translations purely from t_ms.
   * No requestAnimationFrame, Date.now, or timeouts used!
   */
  window.updateSceneTime = function(t_ms) {
    const t = Math.max(0, Math.min(30000, t_ms));
    const sec = t / 1000;
    const fadeWindow = 400; // 0.4s cross-fade

    // 1. Scene Switching & Cross-fades
    for (let i = 0; i < 4; i++) {
      const dur = SCENE_DURATIONS[i];
      let op = 0;

      if (t >= dur.start && t <= dur.end) {
        op = 1;
        // Fade in
        if (t - dur.start < fadeWindow && i > 0) {
          op = (t - dur.start) / fadeWindow;
        }
        // Fade out
        else if (dur.end - t < fadeWindow && i < 3) {
          op = (dur.end - t) / fadeWindow;
        }
      }

      scenes[i].style.opacity = op;
      scenes[i].style.display = (op > 0) ? 'block' : 'none';
    }

    // 2. Slow cinematic camera pan & zoom across 30.0s
    const progress = t / 30000;
    const camZoom = 1.0 + Math.sin(progress * Math.PI) * 0.08;
    const camPanX = (progress * -70);
    const camPanY = (progress * -20);
    svgStage.style.transform = `translate(${camPanX}px, ${camPanY}px) scale(${camZoom})`;

    // 3. Deterministic Character Movements on Ground (No floating, upright)
    // Scene 3: Move soldiers bucket by bucket across the terrain
    const s3Soldier1 = document.getElementById('s3-soldier1');
    const s3Soldier2 = document.getElementById('s3-soldier2');
    if (s3Soldier1 && s3Soldier2 && t >= 15000 && t <= 22500) {
      const s3Time = (t - 15000) / 1000;
      const walk1 = (s3Time * 35) % 360;
      const walk2 = (s3Time * 28) % 320;
      s3Soldier1.setAttribute('transform', `translate(${220 + walk1}, 360)`);
      s3Soldier2.setAttribute('transform', `translate(${780 - walk2}, 360)`);
    }

    // 4. Deterministic Canvas Atmospheric Overlay (Desert dust, heat shimmers)
    ctx.clearRect(0, 0, 1280, 720);

    for (let i = 0; i < NUM_PARTICLES; i++) {
      const p = particleSeeds[i];
      // Compute positions deterministically from time
      const curX = (p.xInit + p.speedX * sec) % 1340 - 30;
      const wave = Math.sin(sec * 2 + p.phase) * 15;
      const curY = (p.yInit + p.speedY * sec + wave) % 760 - 20;

      ctx.beginPath();
      ctx.arc(curX < 0 ? curX + 1300 : curX, curY < 0 ? curY + 740 : curY, p.size, 0, Math.PI * 2);
      ctx.fillStyle = p.isAsh
        ? `rgba(255, 120, 40, ${p.alpha})`
        : `rgba(255, 235, 160, ${p.alpha * 0.8})`;
      ctx.fill();
    }
  };

  // Initialize stage at time 0
  window.updateSceneTime(0);
</script>
