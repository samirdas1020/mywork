<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Masada Siege Ramp - World Historycast</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #111;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
  }
  #viewport {
    position: relative;
    width: 1280px;
    height: 720px;
    background: #000;
    overflow: hidden;
    box-shadow: 0 0 40px rgba(0,0,0,0.8);
  }
  svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 1280px;
    height: 720px;
  }
  canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 1280px;
    height: 720px;
    pointer-events: none;
  }
  /* Limb Rigging Animations */
  .walk-leg-l { transform-origin: 32px 55px; animation: legL 0.65s infinite alternate ease-in-out; }
  .walk-leg-r { transform-origin: 48px 55px; animation: legR 0.65s infinite alternate ease-in-out; }
  .walk-arm-l { transform-origin: 26px 28px; animation: armL 0.65s infinite alternate ease-in-out; }
  .walk-arm-r { transform-origin: 54px 28px; animation: armR 0.65s infinite alternate ease-in-out; }
  .body-bob    { animation: bob 0.325s infinite alternate ease-in-out; }

  @keyframes legL { from { transform: rotate(-24deg); } to { transform: rotate(24deg); } }
  @keyframes legR { from { transform: rotate(24deg); } to { transform: rotate(-24deg); } }
  @keyframes armL { from { transform: rotate(28deg); } to { transform: rotate(-28deg); } }
  @keyframes armR { from { transform: rotate(-28deg); } to { transform: rotate(28deg); } }
  @keyframes bob  { from { transform: translateY(0px); } to { transform: translateY(-4px); } }

  .carry-arm-l { transform-origin: 26px 28px; animation: carryL 0.7s infinite alternate ease-in-out; }
  .carry-arm-r { transform-origin: 54px 28px; animation: carryR 0.7s infinite alternate ease-in-out; }
  @keyframes carryL { from { transform: rotate(-10deg); } to { transform: rotate(15deg); } }
  @keyframes carryR { from { transform: rotate(-35deg); } to { transform: rotate(-10deg); } }

  .flag-wave { transform-origin: 10px 10px; animation: flagW 1.2s infinite alternate ease-in-out; }
  @keyframes flagW { from { transform: skewY(-4deg) scaleX(0.96); } to { transform: skewY(5deg) scaleX(1.02); } }

  .text-badge {
    font-family: 'Impact', 'Arial Black', sans-serif;
    text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 0 4px 10px rgba(0,0,0,0.6);
  }
</style>
</head>
<body>

<script>
  /* ================= Deterministic Setup & Crowd Generation ================= */
  // Seeded random function for deterministic army placement
  let seed = 12345;
  function pseudoRandom() {
    seed = (seed * 9301 + 49297) % 233280;
    return seed / 233280;
  }

  // Populate Scene 4 with 150 Roman Soldiers to visually demonstrate the 15,000 scale
  const armyContainer = document.getElementById("roman-army-container");
  const soldierCount = 150;
  const svgNS = "http://www.w3.org/2000/svg";

  for (let i = 0; i < soldierCount; i++) {
    const row = Math.floor(i / 30); // 5 ranks deep
    const col = i % 30;
    const g = document.createElementNS(svgNS, "g");
    
    // Position soldiers marching in tight formation up the ridge
    const x = 450 + (col * 26) + (row * -15) + (pseudoRandom() * 4);
    const y = 370 + (row * 35) + (pseudoRandom() * 6);
    const scale = 0.45 + (row * 0.1); // depth scale

    g.setAttribute("transform", `translate(${x}, ${y}) scale(${scale})`);
    g.setAttribute("class", "army-unit");

    // Scutum (Red Roman curved shield)
    const shield = document.createElementNS(svgNS, "rect");
    shield.setAttribute("x", "-8");
    shield.setAttribute("y", "-14");
    shield.setAttribute("width", "16");
    shield.setAttribute("height", "28");
    shield.setAttribute("rx", "3");
    shield.setAttribute("fill", "#dc2626");
    shield.setAttribute("stroke", "#eab308");
    shield.setAttribute("stroke-width", "1.5");

    // Galea Helmet / Head
    const head = document.createElementNS(svgNS, "circle");
    head.setAttribute("cx", "0");
    head.setAttribute("cy", "-20");
    head.setAttribute("r", "6");
    head.setAttribute("fill", "#ca8a04");

    // Pilum / Spear
    const spear = document.createElementNS(svgNS, "line");
    spear.setAttribute("x1", "4");
    spear.setAttribute("y1", "-36");
    spear.setAttribute("x2", "4");
    spear.setAttribute("y2", "14");
    spear.setAttribute("stroke", "#475569");
    spear.setAttribute("stroke-width", "2");

    g.appendChild(spear);
    g.appendChild(head);
    g.appendChild(shield);
    armyContainer.appendChild(g);
  }

  /* ================= Atmospheric Particle Simulation (Canvas) ================= */
  const canvas = document.getElementById('dustCanvas');
  const ctx = canvas.getContext('2d');
  const PARTICLE_COUNT = 75;
  const particles = [];

  // Generate particle parameters with single initial seed
  for (let i = 0; i < PARTICLE_COUNT; i++) {
    particles.push({
      baseX: pseudoRandom() * 1280,
      baseY: pseudoRandom() * 720,
      speedX: 0.08 + pseudoRandom() * 0.14, // drifting desert wind
      speedY: -0.02 - pseudoRandom() * 0.05, // heat rise
      radius: 1.2 + pseudoRandom() * 2.4,
      alpha: 0.2 + pseudoRandom() * 0.5
    });
  }

  /* ================= Deterministic Clock Update Function ================= */
  // Exactly 6 narrative scenes mapped across 30.0s (30,000 ms)
  const sceneWindows = [
    { id: "scene-0", start: 0,     end: 2000 },
    { id: "scene-1", start: 2000,  end: 11400 },
    { id: "scene-2", start: 11400, end: 18600 },
    { id: "scene-3", start: 18600, end: 23800 },
    { id: "scene-4", start: 23800, end: 27000 },
    { id: "scene-5", start: 27000, end: 30000 }
  ];

  const cameraRoot = document.getElementById("camera-root");

  window.updateSceneTime = function(t_ms) {
    // Clamp to exactly 30 seconds
    const t = Math.max(0, Math.min(30000, t_ms));

    // 1. Scene Visibility & 0.4s Cross-fade
    const FADE = 400; // ms
    sceneWindows.forEach(sc => {
      const el = document.getElementById(sc.id);
      if (!el) return;

      if (t < sc.start || t > sc.end) {
        el.style.display = "none";
        el.style.opacity = 0;
      } else {
        el.style.display = "inline";
        let opacity = 1;
        // Fade in
        if (t - sc.start < FADE && sc.start !== 0) {
          opacity = (t - sc.start) / FADE;
        }
        // Fade out
        else if (sc.end - t < FADE && sc.end !== 30000) {
          opacity = (sc.end - t) / FADE;
        }
        el.style.opacity = opacity;
      }
    });

    // 2. Cinematic Camera Pan & Subtle Zoom (Safe bounds within padding)
    const progress = t / 30000;
    const camX = -progress * 60; // slow drift left
    const camY = Math.sin(progress * Math.PI) * -15; // subtle rise
    const camScale = 1.0 + (progress * 0.05); // slight cinematic zoom
    cameraRoot.setAttribute("transform", `translate(${camX}, ${camY}) scale(${camScale})`);

    // 3. Scene-Specific Deterministic Animations
    // Scene 3: Bucket dumping earth growth
    const dirtPile = document.getElementById("dirt-pile-group");
    if (dirtPile && t >= 11400 && t <= 18600) {
      const dumpProgress = (t - 11400) / 7200;
      const s = 1 + dumpProgress * 0.8;
      dirtPile.setAttribute("transform", `translate(1080, ${230 - dumpProgress * 20}) scale(${s})`);
    }

    // Scene 4: Legion marching shift deterministically by t_ms
    if (t >= 18600 && t <= 23800) {
      const armyT = (t - 18600) * 0.015;
      armyContainer.setAttribute("transform", `translate(${Math.sin(armyT) * 4}, ${-armyT * 2})`);
    }

    // 4. Atmospheric Dust Particle Draw (Deterministic for t_ms)
    ctx.clearRect(0, 0, 1280, 720);
    ctx.fillStyle = "#fed7aa";

    for (let i = 0; i < PARTICLE_COUNT; i++) {
      const p = particles[i];
      // Compute deterministic pos from t
      const x = (p.baseX + t * p.speedX) % 1280;
      const y = (p.baseY + t * p.speedY + 720000) % 720;
      
      // Heat shimmer oscillation
      const shimmer = Math.sin(t * 0.005 + i) * 1.5;

      ctx.globalAlpha = p.alpha * (0.7 + 0.3 * Math.sin(t * 0.003 + i));
      ctx.beginPath();
      ctx.arc(x + shimmer, y, p.radius, 0, Math.PI * 2);
      ctx.fill();
    }
  };

  // Initialize at t = 0
  window.updateSceneTime(0);
</script>
