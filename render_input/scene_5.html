<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>King Herod: Extremes, Paranoia, and Ruthless Power</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #090a0f;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
  }
  #viewport {
    position: relative;
    width: 1280px;
    height: 720px;
    background: #000;
    overflow: hidden;
    box-shadow: 0 0 50px rgba(0,0,0,0.9);
  }
  svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 1280px;
    height: 720px;
  }
  canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 1280px;
    height: 720px;
    pointer-events: none;
  }

  /* Articulated Limb Rigging (CSS Keyframes with absolute px transform-origin) */
  .herod-arm-l  { transform-origin: 24px 36px; animation: herodGestureL 1.2s infinite alternate ease-in-out; }
  .herod-arm-r  { transform-origin: 58px 36px; animation: herodScepterR 1.4s infinite alternate ease-in-out; }
  .leg-l-std    { transform-origin: 30px 62px; animation: legLWalk 0.7s infinite alternate ease-in-out; }
  .leg-r-std    { transform-origin: 52px 62px; animation: legRWalk 0.7s infinite alternate ease-in-out; }
  .char-bob     { animation: charBob 0.35s infinite alternate ease-in-out; }

  @keyframes herodGestureL { from { transform: rotate(-25deg); } to { transform: rotate(15deg); } }
  @keyframes herodScepterR { from { transform: rotate(20deg); } to { transform: rotate(-10deg); } }
  @keyframes legLWalk { from { transform: rotate(-18deg); } to { transform: rotate(18deg); } }
  @keyframes legRWalk { from { transform: rotate(18deg); } to { transform: rotate(-18deg); } }
  @keyframes charBob  { from { transform: translateY(0px); } to { transform: translateY(-3.5px); } }

  /* Paranoia and Threat Rigging */
  .arm-dagger-l { transform-origin: 24px 34px; animation: daggerStrike 0.8s infinite alternate ease-in-out; }
  .arm-cower-r  { transform-origin: 54px 34px; animation: pleadLimb 0.9s infinite alternate ease-in-out; }
  @keyframes daggerStrike { from { transform: rotate(-10deg); } to { transform: rotate(-55deg); } }
  @keyframes pleadLimb    { from { transform: rotate(15deg); } to { transform: rotate(45deg); } }

  /* Mob Boss Scepter Tap */
  .arm-boss-scepter { transform-origin: 58px 36px; animation: bossTap 0.9s infinite alternate ease-in-out; }
  @keyframes bossTap { from { transform: rotate(5deg); } to { transform: rotate(-25deg); } }

  /* Subtle crown shine */
  .crown-glow { transform-origin: 41px 8px; animation: pulseCrown 1.6s infinite alternate ease-in-out; }
  @keyframes pulseCrown { from { transform: scale(0.96); opacity: 0.8; } to { transform: scale(1.08); opacity: 1; } }

  .text-label {
    font-family: 'Impact', 'Arial Black', sans-serif;
    text-shadow: 3px 3px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 0 4px 12px rgba(0,0,0,0.85);
    letter-spacing: 1px;
  }
</style>
</head>
<body>

<div id="viewport">
  <svg id="stage" viewBox="0 0 1280 720">
    <defs>
      <!-- Gradients -->
      <linearGradient id="palaceDawn" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#451a03"/>
        <stop offset="45%" stop-color="#b45309"/>
        <stop offset="100%" stop-color="#fde047"/>
      </linearGradient>
      <linearGradient id="paranoiaSky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#020617"/>
        <stop offset="60%" stop-color="#1e1b4b"/>
        <stop offset="100%" stop-color="#450a0a"/>
      </linearGradient>
      <linearGradient id="mobBossFloor" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#1e293b"/>
        <stop offset="100%" stop-color="#090d16"/>

      <linearGradient id="bloodRedGrad" x1="0" y1="0" x2="1" y2="1">

        <stop offset="50%" stop-color="#991b1b"/>
        <stop offset="100%" stop-color="#450a0a"/>

        <stop offset="0%" stop-color="#7e22ce"/>
        <stop offset="60%" stop-color="#581c87"/>
        <stop offset="100%" stop-color="#3b0764"/>
      </linearGradient>
    </defs>

    <g id="camera-root">
      <!-- ================= SCENE 0: [0.0s - 5.0s] KING HEROD INSTALLED TO KEEP THE PEACE ================= -->
      <!-- Timed: [0.0-1.5s intro buffer / 1.5-4.1s] installed King Herod, [4.1-5.0s] to keep the peace -->
      <g class="scene" id="scene-0">
        <rect x="-100" y="-100" width="1480" height="920" fill="url(#palaceDawn)"/>
        <!-- Royal Palace in Jerusalem / Fort Antonia Colonnades -->
        <g transform="translate(160, 200)">

          <!-- Ornate Stone Pillars -->
          <rect x="40" y="30" width="34" height="420" fill="#fde047"/>
          <rect x="240" y="30" width="34" height="420" fill="#fde047"/>
          <rect x="680" y="30" width="34" height="420" fill="#fde047"/>
          <rect x="880" y="30" width="34" height="420" fill="#fde047"/>
          <line x1="0" y1="20" x2="960" y2="20" stroke="#ca8a04" stroke-width="4"/>
        </g>
        <!-- Palace Polished Floor -->
        <path d="M-80,560 L1380,560 L1380,750 L-80,750 Z" fill="#78350f"/>
        <path d="M-80,620 L1380,620 L1380,750 L-80,750 Z" fill="#451a03"/>

        <!-- Roman Standard Bearer / Official Standing on Left Endorsing Herod -->
        <g class="char-bob" transform="translate(340, 410) scale(1.2)">
          <rect x="26" y="58" width="13" height="48" rx="4" fill="#fed7aa"/>
          <rect x="44" y="58" width="13" height="48" rx="4" fill="#fed7aa"/>
          <rect x="22" y="98" width="22" height="10" rx="3" fill="#78350f"/>

          <circle cx="41" cy="12" r="14" fill="#fed7aa"/>
          <circle cx="46" cy="11" r="2.5" fill="#0f172a"/>
          <path d="M26,8 Q41,-8 56,8 L58,16 L24,16 Z" fill="#ca8a04"/>
          <!-- Arm holding Aquila / Roman SPQR Standard -->
          <g class="herod-arm-l">
            <rect x="18" y="24" width="12" height="30" rx="4" fill="#fed7aa"/>
            <line x1="24" y1="-80" x2="24" y2="80" stroke="#ca8a04" stroke-width="4"/>
            <rect x="4" y="-75" width="40" height="28" fill="#b91c1c"/>
            <text x="24" y="-56" font-family="Arial Black" font-size="10" fill="#fef08a" text-anchor="middle">SPQR</text>

        <!-- Ornate Golden Throne for King Herod -->
        <path d="M680,310 L840,310 L850,560 L670,560 Z" fill="#ca8a04" stroke="#facc15" stroke-width="5"/>

        <g class="char-bob" transform="translate(720, 370) scale(1.35)">
          <!-- Legs -->
          <g class="leg-l-std">
            <rect x="26" y="58" width="13" height="48" rx="4" fill="#fed7aa"/>
            <rect x="22" y="98" width="22" height="10" rx="3" fill="#ca8a04"/>
          </g>
          <g class="leg-r-std">
            <rect x="44" y="58" width="13" height="48" rx="4" fill="#fed7aa"/>
            <rect x="40" y="98" width="22" height="10" rx="3" fill="#ca8a04"/>
          </g>
          <!-- Royal Tyrian Purple Robe with Gold Trim -->
          <rect x="20" y="22" width="42" height="46" rx="6" fill="url(#herodRobeGrad)"/>
          <path d="M20,22 L62,22 L56,66 L26,66 Z" fill="#6b21a8"/>
          <path d="M28,22 L41,44 L54,22" stroke="#facc15" stroke-width="3" fill="none"/>
          <!-- Expressive Head & Regal Crown -->
          <circle cx="41" cy="11" r="14" fill="#fed7aa"/>

          <path d="M28,12 Q41,26 54,12 L54,18 Q41,30 28,18 Z" fill="#1e293b"/> <!-- Beard -->
          <circle cx="46" cy="10" r="2.5" fill="#0f172a"/>

          <!-- Crown with Jewels -->

            <line x1="58" y1="10" x2="58" y2="75" stroke="#facc15" stroke-width="4"/>
            <circle cx="58" cy="8" r="7" fill="#dc2626" stroke="#facc15" stroke-width="2"/>
          </g>
        </g>

        <!-- Titles -->
        <g transform="translate(640, 105)">
          <rect x="-310" y="-45" width="620" height="90" rx="16" fill="#000" opacity="0.85" stroke="#facc15" stroke-width="2"/>
          <text class="text-label" x="0" y="2" text-anchor="middle" fill="#facc15" font-size="40">KING HEROD THE GREAT</text>
          <text class="text-label" x="0" y="34" text-anchor="middle" fill="#ffffff" font-size="20">CLIENT RULER INSTALLED TO KEEP THE PEACE</text>
        </g>
      </g>

      <!-- ================= SCENE 1: [5.0s - 12.1s] A MAN OF UNBELIEVABLE EXTREMES ================= -->
      <!-- Timed: [5.0-8.0s] research shows man, [8.0-11.3s] unbelievable extremes, [11.3-12.1s] Oh for sure -->
      <g class="scene" id="scene-1">
        <rect x="-100" y="-100" width="1480" height="920" fill="#0f172a"/>
        <!-- Dramatic Split Screen: Master Builder vs Ruthless Tyrant -->
        <!-- Left Side: Grand Architectural Wonders (The Builder) -->
        <g transform="translate(320, 360)">
          <circle cx="0" cy="0" r="190" fill="#1e3a8a" stroke="#38bdf8" stroke-width="6"/>
          <!-- Second Temple & Caesarea Harbor Architectural Vector -->
          <polygon points="-90,-30 0,-90 90,-30" fill="#fbbf24"/>
          <rect x="-80" y="-30" width="160" height="120" fill="#e2e8f0"/>
          <line x1="-50" y1="-30" x2="-50" y2="90" stroke="#94a3b8" stroke-width="6"/>
          <line x1="0" y1="-30" x2="0" y2="90" stroke="#94a3b8" stroke-width="6"/>
          <line x1="50" y1="-30" x2="50" y2="90" stroke="#94a3b8" stroke-width="6"/>
          <!-- Label -->
          <rect x="-110" y="90" width="220" height="38" rx="8" fill="#0284c7"/>
          <text class="text-label" x="0" y="116" text-anchor="middle" fill="#ffffff" font-size="20">MASTER BUILDER</text>
        </g>

        <!-- Center Thunderbolt / Split Indicator -->
        <g transform="translate(640, 360)">
          <line x1="0" y1="-220" x2="0" y2="220" stroke="#facc15" stroke-width="4" stroke-dasharray="14,8"/>
          <circle cx="0" cy="0" r="35" fill="#facc15"/>
          <text class="text-label" x="0" y="10" text-anchor="middle" fill="#000" font-size="26">VS</text>
        </g>

        <!-- Right Side: Ruthless Brutality (The Tyrant) -->
        <g transform="translate(960, 360)">
          <circle cx="0" cy="0" r="190" fill="#7f1d1d" stroke="#ef4444" stroke-width="6"/>
          <!-- Crimson Skull / Dagger Vector -->
          <circle cx="0" cy="-20" r="45" fill="#f8fafc"/>
          <ellipse cx="-16" cy="-24" rx="10" ry="14" fill="#000"/>
          <ellipse cx="16" cy="-24" rx="10" ry="14" fill="#000"/>
          <polygon points="-8,-6 0,-18 8,-6" fill="#000"/>
          <!-- Crossed Daggers -->
          <line x1="-60" y1="40" x2="60" y2="-40" stroke="#cbd5e1" stroke-width="8"/>
          <line x1="60" y1="40" x2="-60" y2="-40" stroke="#cbd5e1" stroke-width="8"/>
          <!-- Label -->
          <rect x="-120" y="90" width="240" height="38" rx="8" fill="#b91c1c"/>
          <text class="text-label" x="0" y="116" text-anchor="middle" fill="#ffffff" font-size="20">BLOODY TYRANT</text>
        </g>

        <!-- Extremes Banner -->
        <g transform="translate(640, 105)">
          <rect x="-310" y="-45" width="620" height="90" rx="16" fill="#000" opacity="0.85" stroke="#f59e0b" stroke-width="2"/>
          <text class="text-label" x="0" y="2" text-anchor="middle" fill="#f59e0b" font-size="38">UNBELIEVABLE EXTREMES</text>
          <text class="text-label" x="0" y="34" text-anchor="middle" fill="#ffffff" font-size="20">GENIUS ARCHITECT & MERCILESS RULER</text>
        </g>
      </g>

      <!-- ================= SCENE 2: [12.1s - 21.1s] CONSUMED BY PARANOIA & FAMILY MURDERS ================= -->

      <g class="scene" id="scene-2">
        <rect x="-100" y="-100" width="1480" height="920" fill="url(#paranoiaSky)"/>

        <!-- Sinister Swirling Paranoia Eyes & Shadows in the Dark -->
        <g stroke="#ef4444" stroke-width="2" fill="none" opacity="0.6">
          <ellipse cx="220" cy="240" rx="40" ry="18"/>
          <circle cx="220" cy="240" r="8" fill="#ef4444"/>
          <ellipse cx="1060" cy="220" rx="40" ry="18"/>
          <circle cx="1060" cy="220" r="8" fill="#ef4444"/>
          <ellipse cx="180" cy="460" rx="35" ry="15"/>
          <circle cx="180" cy="460" r="7" fill="#ef4444"/>
        </g>

        <!-- Paranoid Herod (Center Left) Clutching Dagger in Suspicion -->
        <g class="char-bob" transform="translate(440, 390) scale(1.35)">
          <!-- Legs -->
          <rect x="26" y="58" width="13" height="48" rx="4" fill="#fed7aa"/>
          <rect x="44" y="58" width="13" height="48" rx="4" fill="#fed7aa"/>
          <rect x="22" y="98" width="22" height="10" rx="3" fill="#ca8a04"/>
          <rect x="40" y="98" width="22" height="10" rx="3" fill="#ca8a04"/>
          <!-- Royal Robe -->
          <rect x="20" y="22" width="42" height="46" rx="6" fill="#450a0a"/>
          <path d="M20,22 L62,22 L56,66 L26,66 Z" fill="#7f1d1d"/>
          <!-- Wild Paranoid Eyes -->
          <circle cx="41" cy="11" r="14" fill="#fed7aa"/>
          <circle cx="45" cy="10" r="4.5" fill="#ffffff"/>
          <circle cx="46" cy="10" r="2" fill="#ef4444"/> <!-- Bloodshot eye -->
          <path d="M38,4 Q46,2 52,7" stroke="#000" stroke-width="2.5" fill="none"/>
          <polygon points="26,6 31,-8 37,2 41,-10 45,2 51,-8 56,6" fill="#facc15"/>
          <!-- Dagger Arm Striking / Menacing -->
          <g class="arm-dagger-l">
            <rect x="18" y="22" width="12" height="30" rx="4" fill="#7f1d1d"/>
            <!-- Curved Bronze Dagger -->
            <polygon points="24,50 16,74 26,68" fill="#e2e8f0" stroke="#64748b"/>
            <rect x="18" y="48" width="12" height="6" fill="#ca8a04"/>
          </g>
          <g class="herod-arm-r">
            <rect x="52" y="22" width="12" height="30" rx="4" fill="#7f1d1d"/>
            <circle cx="58" cy="50" r="5" fill="#fed7aa"/>
          </g>
        </g>

        <!-- Condemned Family Members Group (Wife Mariamne & Sons Falling/Fading) -->
        <g id="family-victims-group" transform="translate(820, 390)">
          <!-- Victim 1: Mariamne (Hasmonean Royal Wife) -->
          <g transform="translate(-80, 0) scale(1.15)">
            <rect x="20" y="24" width="36" height="48" rx="6" fill="#1e3a8a"/>
            <circle cx="38" cy="12" r="13" fill="#fed7aa"/>
            <path d="M26,10 Q38,-4 50,6 L50,14 Z" fill="#78350f"/>
            <circle cx="42" cy="12" r="2.5" fill="#0f172a"/>
            <!-- Strikethrough eliminated tag -->
            <line x1="10" y1="20" x2="66" y2="70" stroke="#dc2626" stroke-width="4"/>
            <line x1="66" y1="20" x2="10" y2="70" stroke="#dc2626" stroke-width="4"/>
          </g>
          <!-- Victim 2: Son Aristobulus / Antipater -->
          <g transform="translate(40, 10) scale(1.1)">
            <rect x="20" y="24" width="36" height="48" rx="6" fill="#334155"/>

            <polygon points="28,6 33,-4 38,2 43,-4 48,6" fill="#ca8a04"/>
            <circle cx="42" cy="12" r="2.5" fill="#0f172a"/>
            <line x1="10" y1="20" x2="66" y2="70" stroke="#dc2626" stroke-width="4"/>
            <line x1="66" y1="20" x2="10" y2="70" stroke="#dc2626" stroke-width="4"/>
          </g>
        </g>

        <!-- Titles -->
        <g transform="translate(640, 105)">
          <rect x="-330" y="-45" width="660" height="90" rx="16" fill="#450a0a" opacity="0.9" stroke="#ef4444" stroke-width="3"/>

        <rect x="-100" y="-100" width="1480" height="920" fill="url(#mobBossFloor)"/>

        <!-- Shadowy Throne Room Pillars & Ominous Spotlights -->
        <path d="M-80,540 L1380,540 L1380,750 L-80,750 Z" fill="#0b0f19"/>
        <line x1="280" y1="0" x2="420" y2="540" stroke="#ca8a04" stroke-width="1.5" opacity="0.3"/>
        <line x1="1000" y1="0" x2="860" y2="540" stroke="#ca8a04" stroke-width="1.5" opacity="0.3"/>

        <!-- Massive Regal Godfather Throne -->

          <rect x="-140" y="-140" width="280" height="260" rx="14" fill="#000" stroke="#ca8a04" stroke-width="5"/>
          <polygon points="0,-190 -70,-140 70,-140" fill="#ca8a04"/>

        <!-- Herod as the "Mob Boss of Judea" Seated in Full Power -->

          <rect x="10" y="58" width="14" height="48" rx="4" fill="#ca8a04"/>

          <circle cx="6" cy="9" r="2.5" fill="#0f172a"/>

        <g transform="translate(640, 105)">

          <text class="text-label" x="0" y="34" text-anchor="middle" fill="#fef08a" font-size="20">"CROSS HIM OR EVEN LOOK LIKE YOU MIGHT"</text>

<script>
  /* ================= Deterministic Guard Squad Creation (Rule 6 & 8b) ================= */
  let seed = 67891;
  function seededRand() {
    seed = (seed * 9301 + 49297) % 233280;
    return seed / 233280;
  }

  // Populate Scene 3 with Herod's personal Thracian and Celtic mercenary bodyguards
  const bodyguardContainer = document.getElementById("bodyguard-crowd-container");
  const svgNS = "http://www.w3.org/2000/svg";
  const guardCount = 20;

  for (let i = 0; i < guardCount; i++) {
    const isLeft = i < 10;
    const col = i % 10;
    const g = document.createElementNS(svgNS, "g");

    const x = isLeft ? 120 + col * 26 : 920 + col * 26;
    const y = 490 + (col % 2) * 20;
    const s = 0.55 + (col % 3) * 0.05;

    g.setAttribute("transform", `translate(${x}, ${y}) scale(${s})`);

    // Guard Spear
    const spear = document.createElementNS(svgNS, "line");
    spear.setAttribute("x1", "10");
    spear.setAttribute("y1", "-65");
    spear.setAttribute("x2", "10");
    spear.setAttribute("y2", "30");
    spear.setAttribute("stroke", "#94a3b8");
    spear.setAttribute("stroke-width", "3");

    // Guard Helmet
    const helm = document.createElementNS(svgNS, "circle");
    helm.setAttribute("cx", "0");
    helm.setAttribute("cy", "-32");
    helm.setAttribute("r", "9");
    helm.setAttribute("fill", "#ca8a04");

    // Guard Armor / Shield
    const shield = document.createElementNS(svgNS, "rect");
    shield.setAttribute("x", "-12");
    shield.setAttribute("y", "-22");
    shield.setAttribute("width", "24");
    shield.setAttribute("height", "44");
    shield.setAttribute("rx", "4");
    shield.setAttribute("fill", "#450a0a");
    shield.setAttribute("stroke", "#ca8a04");
    shield.setAttribute("stroke-width", "2");

    g.appendChild(spear);
    g.appendChild(helm);
    g.appendChild(shield);
    bodyguardContainer.appendChild(g);
  }

  /* ================= Atmospheric Canvas Particles ================= */
  const canvas = document.getElementById("ambientCanvas");
  const ctx = canvas.getContext("2d");
  const PARTICLE_COUNT = 75;
  const particles = [];

  for (let i = 0; i < PARTICLE_COUNT; i++) {
    particles.push({
      x: seededRand() * 1280,
      y: seededRand() * 720,
      vx: 0.05 + seededRand() * 0.12,
      vy: -0.04 - seededRand() * 0.08,
      r: 1.2 + seededRand() * 2.2,
      alpha: 0.25 + seededRand() * 0.5
    });
  }

  /* ================= Deterministic Clock Function (Rule 5 & 8) ================= */
  // Exactly mapped across 30.0s (30,000ms):
  // Scene 0: [0.0s - 5.0s]   (0 - 5000ms)     Installed King Herod to keep peace
  // Scene 1: [5.0s - 12.1s]  (5000 - 12100ms) Man of unbelievable extremes (Builder vs Tyrant)
  // Scene 2: [12.1s - 21.1s] (12100 - 21100ms) Consumed by paranoia & murdering family rivals
  // Scene 3: [21.1s - 30.0s] (21100 - 30000ms) Terrifying ancient mob boss / don't cross him
  const scenes = [
    { id: "scene-0", start: 0,     end: 5000 },
    { id: "scene-1", start: 5000,  end: 12100 },
    { id: "scene-2", start: 12100, end: 21100 },
    { id: "scene-3", start: 21100, end: 30000 }
  ];

  const cameraRoot = document.getElementById("camera-root");
  const familyVictims = document.getElementById("family-victims-group");

  window.updateSceneTime = function(t_ms) {
    const t = Math.max(0, Math.min(30000, t_ms));
    const FADE = 400; // 0.4s clean crossfade

    // 1. Scene Visibility & Cross-fade (Deterministic)
    scenes.forEach(sc => {
      const el = document.getElementById(sc.id);
      if (!el) return;

      if (t < sc.start || t > sc.end) {
        el.style.display = "none";
        el.style.opacity = 0;
      } else {
        el.style.display = "inline";
        let opacity = 1;
        if (t - sc.start < FADE && sc.start !== 0) {
          opacity = (t - sc.start) / FADE;
        } else if (sc.end - t < FADE && sc.end !== 30000) {
          opacity = (sc.end - t) / FADE;
        }
        el.style.opacity = opacity;
      }
    });

    // 2. Slow Cinematic Camera Pan / Zoom across 30 seconds
    const progress = t / 30000;
    const camX = -progress * 46;
    const camY = Math.sin(progress * Math.PI) * -10;
    const camScale = 1.0 + (progress * 0.045);
    cameraRoot.setAttribute("transform", `translate(${camX}, ${camY}) scale(${camScale})`);

    // 3. Scene-Specific Deterministic Actions
    // Scene 2: Family victims fade & sink when murder is mentioned [14.7s - 21.1s]
    if (familyVictims && t >= 12100 && t <= 21100) {
      if (t >= 14700) {
        const fallProgress = Math.min(1, (t - 14700) / 4000);
        const fallY = fallProgress * 45;
        const op = Math.max(0.15, 1 - fallProgress * 0.7);
        familyVictims.setAttribute("transform", `translate(820, ${390 + fallY})`);
        familyVictims.style.opacity = op;
      } else {
        familyVictims.setAttribute("transform", "translate(820, 390)");
        familyVictims.style.opacity = 1;
      }
    }

    // Scene 3: Bodyguard squad subtle tense breathing shift
    if (t >= 21100) {
      const bossT = (t - 21100) * 0.005;
      bodyguardContainer.setAttribute("transform", `translate(0, ${Math.sin(bossT) * 2})`);
    }

    // 4. Atmospheric Particles on Canvas
    ctx.clearRect(0, 0, 1280, 720);
    for (let i = 0; i < PARTICLE_COUNT; i++) {
      const p = particles[i];
      const px = (p.x + t * p.vx) % 1280;
      const py = (p.y + t * p.vy + 720000) % 720;
      const shimmer = Math.sin(t * 0.004 + i) * 1.5;

      ctx.fillStyle = (t >= 12100) ? "#ef4444" : "#fef08a";
      ctx.globalAlpha = p.alpha * (0.6 + 0.4 * Math.sin(t * 0.003 + i));
      ctx.beginPath();
      ctx.arc(px + shimmer, py, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
  };

  // Initial render at t = 0
  window.updateSceneTime(0);
</script>
</body>
</html>
