<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>2,000 Year History Animation</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0705;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #stage-container {
      position: relative;
      width: 1280px;
      height: 720px;
      background: #000;
      overflow: hidden;
    }
    #svg-stage {
      position: absolute;
      top: 0;
      left: 0;
      width: 1280px;
      height: 720px;
      transform-origin: 640px 360px;
    }
    #canvas-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 1280px;
      height: 720px;
      pointer-events: none;
      z-index: 10;
    }

    /* Limb & Body Rigging Keyframes */
    @keyframes walkA { 0% { transform: rotate(-22deg); } 100% { transform: rotate(22deg); } }
    @keyframes walkB { 0% { transform: rotate(22deg); } 100% { transform: rotate(-22deg); } }
    @keyframes bobCycle { 0% { transform: translateY(0px); } 50% { transform: translateY(-6px); } 100% { transform: translateY(0px); } }
    @keyframes headTilt { 0% { transform: rotate(-3deg); } 100% { transform: rotate(4deg); } }
    @keyframes swordSwing { 0% { transform: rotate(-5deg); } 100% { transform: rotate(-35deg); } }
    @keyframes flagDrift { 0% { transform: skewY(0deg) scaleX(1); } 100% { transform: skewY(5deg) scaleX(0.95); } }
    @keyframes sunGlowPulse { 0% { transform: scale(1); opacity: 0.85; } 100% { transform: scale(1.1); opacity: 1; } }

    /* Synchronized timing: Walk cycle limbs 0.8s, head & props 1.6s */
    .anim-leg-l  { animation: walkA 0.8s infinite alternate ease-in-out; }
    .anim-leg-r  { animation: walkB 0.8s infinite alternate ease-in-out; }
    .anim-arm-l  { animation: walkB 0.8s infinite alternate ease-in-out; } /* Opposite to left leg */
    .anim-arm-r  { animation: walkA 0.8s infinite alternate ease-in-out; } /* Opposite to right leg */
    .anim-bob    { animation: bobCycle 0.8s infinite ease-in-out; }
    .anim-head   { animation: headTilt 1.6s infinite alternate ease-in-out; }
    .anim-sword  { animation: swordSwing 1.6s infinite alternate ease-in-out; }
    .anim-flag   { animation: flagDrift 1.4s infinite alternate ease-in-out; }
    .anim-sun    { animation: sunGlowPulse 3s infinite alternate ease-in-out; transform-origin: center; }
  </style>
</head>
<body>

<div id="stage-container">
  <svg id="svg-stage" viewBox="0 0 1280 720">
    <defs>
      <!-- Sky and Terrain Gradients -->
      <linearGradient id="sky1" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#d84315"/>
        <stop offset="45%" stop-color="#f57c00"/>
        <stop offset="80%" stop-color="#ffb74d"/>
        <stop offset="100%" stop-color="#ffe0b2"/>
      </linearGradient>

      <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#1565c0"/>
        <stop offset="40%" stop-color="#1e88e5"/>
        <stop offset="75%" stop-color="#64b5f6"/>
        <stop offset="100%" stop-color="#bbdefb"/>
      </linearGradient>

      <linearGradient id="sky3" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#212121"/>
        <stop offset="40%" stop-color="#37474f"/>
        <stop offset="75%" stop-color="#546e7a"/>
        <stop offset="100%" stop-color="#cfd8dc"/>
      </linearGradient>

      <linearGradient id="sky4" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#880e4f"/>
        <stop offset="40%" stop-color="#c2185b"/>
        <stop offset="75%" stop-color="#f06292"/>
        <stop offset="100%" stop-color="#fce4ec"/>
      </linearGradient>

      <linearGradient id="goldHelm" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#ffe082"/>
        <stop offset="50%" stop-color="#ffb300"/>
        <stop offset="100%" stop-color="#e65100"/>
      </linearGradient>

      <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="40%" stop-color="#fff59d"/>
        <stop offset="70%" stop-color="#ffb74d" stop-opacity="0.6"/>
        <stop offset="100%" stop-color="#ff9800" stop-opacity="0"/>
      </radialGradient>
    </defs>

    <!-- ========================================================
         SCENE 1: CONTESTED GEOGRAPHY (0.0s - 7.5s)

          <g class="anim-head" style="transform-origin: 50px 64px;">
            <ellipse cx="50" cy="40" rx="20" ry="22" fill="#d79a6b"/>
            <path d="M28,34 C28,14 72,14 72,34 Z" fill="#37474f"/>

          <g class="anim-arm-r" style="transform-origin: 26px 76px;">

            <path d="M40,48 Q46,53 52,48" stroke="#5d4037" stroke-width="2" fill="none"/>
          </g>
        </g>
      </g>
    </g>

    <!-- ========================================================

      <rect x="-100" y="-100" width="1480" height="920" fill="url(#sky3)"/>

    <!-- ========================================================
         SCENE 4: OVERLAPPING LAYERS OF HISTORY & EMPIRE (22.5s - 30.0s)
         ======================================================== -->
    <g class="scene" id="scene-4">
      <rect x="-100" y="-100" width="1480" height="920" fill="url(#sky4)"/>
      <g transform="translate(640, 160)">
        <circle class="anim-sun" cx="0" cy="0" r="130" fill="url(#sunGlow)"/>

        <g class="anim-leg-l" style="transform-origin: 38px 142px;">

          <g class="anim-arm-l" style="transform-origin: 26px 76px;">
            <rect x="18" y="72" width="14" height="48" rx="6" fill="#e0a96d"/>

          </g>
          <!-- Shoulder joint at (74px, 76px) holding looking glass -->
          <g class="anim-sword" style="transform-origin: 74px 76px;">
            <rect x="68" y="72" width="14" height="50" rx="6" fill="#e0a96d"/>
            <circle cx="75" cy="126" r="7" fill="#e0a96d"/>

          <g class="anim-head" style="transform-origin: 50px 64px;">

            <!-- Scholar Cap -->
            <polygon points="18,22 82,22 50,8" fill="#311b92"/>
            <rect x="30" y="22" width="40" height="8" rx="2" fill="#ffd54f"/>
            <circle cx="56" cy="38" r="3" fill="#212121"/>
            <path d="M48,48 Q54,53 60,48" stroke="#5d4037" stroke-width="2" fill="none"/>

      <!-- Sovereign Ruler / Empire Figure (Right) standing solidly at y=600 -->
      <g id="s4-char2" transform="translate(860, 380)">
        <ellipse cx="50" cy="224" rx="42" ry="9" fill="rgba(20,5,30,0.5)"/>
        <!-- Royal Cape -->
        <path class="anim-flag" style="transform-origin: 50px 70px;" d="M22,70 Q-10,120 5,210 Q35,200 40,150 Z" fill="#b71c1c"/>

          <rect x="31" y="138" width="14" height="84" rx="5" fill="#e0a96d"/>

        <g class="anim-leg-l" style="transform-origin: 62px 142px;">
          <rect x="55" y="138" width="14" height="84" rx="5" fill="#e0a96d"/>
          <rect x="49" y="214" width="24" height="14" rx="4" fill="#3e2723"/>
        </g>
        <g class="anim-bob">
          <path d="M22,64 L78,64 L82,142 L18,142 Z" fill="url(#goldHelm)"/>
          <g class="anim-arm-r" style="transform-origin: 26px 76px;">
            <rect x="18" y="72" width="14" height="50" rx="6" fill="#e0a96d"/>
            <circle cx="25" cy="126" r="7" fill="#e0a96d"/>
          </g>
          <!-- Shoulder joint at (74px, 76px) holding royal scepter -->
          <g class="anim-sword" style="transform-origin: 74px 76px;">
            <rect x="68" y="72" width="14" height="48" rx="6" fill="#e0a96d"/>

            <circle cx="75" cy="56" r="8" fill="#d50000" stroke="#ffd54f" stroke-width="2"/>

          <g class="anim-head" style="transform-origin: 50px 64px;">
            <ellipse cx="50" cy="40" rx="20" ry="22" fill="#e0a96d"/>

            <path d="M28,26 L34,10 L42,20 L50,8 L58,20 L66,10 L72,26 Z" fill="url(#goldHelm)" stroke="#ff6f00" stroke-width="1.5"/>
            <circle cx="44" cy="38" r="3" fill="#212121"/>

  <!-- Atmospheric Dynamic Particle Overlay -->
  <canvas id="canvas-overlay" width="1280" height="720"></canvas>
</div>

<script>
  // DOM References
  const svgStage = document.getElementById('svg-stage');
  const canvas = document.getElementById('canvas-overlay');
  const ctx = canvas.getContext('2d');

  const scenes = [
    document.getElementById('scene-1'),
    document.getElementById('scene-2'),
    document.getElementById('scene-3'),
    document.getElementById('scene-4')
  ];

  // 4 Scenes across exactly 30.0s (30,000ms), 7.5s each
  const SCENE_TIMES = [
    { start: 0,     end: 7500 },
    { start: 7500,  end: 15000 },
    { start: 15000, end: 22500 },
    { start: 22500, end: 30000 }
  ];

  // Pre-generate particle seeds once at start (per Rule 9)
  const NUM_PARTICLES = 60;
  const particles = [];
  for (let i = 0; i < NUM_PARTICLES; i++) {
    particles.push({
      xInit: Math.random() * 1280,
      yInit: Math.random() * 720,
      speedX: 20 + Math.random() * 45,
      speedY: -10 - Math.random() * 20,
      size: 1.5 + Math.random() * 3,
      alpha: 0.25 + Math.random() * 0.5,
      phase: Math.random() * Math.PI * 2,
      isEmber: Math.random() > 0.6
    });
  }

  /**
   * Deterministic Synchronized Clock Hook (Rule 5 & 9)
   * Updates active scene opacity/display, camera pan/zoom, character movements, and canvas particles.
   * Absolutely NO requestAnimationFrame, Date.now, setInterval, or CSS transitions used!
   * @param {number} t_ms - Elapsed time in milliseconds (0 - 30000)
   */
  window.updateSceneTime = function(t_ms) {
    const t = Math.max(0, Math.min(30000, t_ms));
    const sec = t / 1000;
    const fade = 400; // 0.4s cross-fade

    // 1. Scene Switching & Deterministic Cross-fade
    for (let i = 0; i < 4; i++) {
      const dur = SCENE_TIMES[i];
      let op = 0;
      if (t >= dur.start && t <= dur.end) {
        op = 1;
        if (t - dur.start < fade && i > 0) {
          op = (t - dur.start) / fade;
        } else if (dur.end - t < fade && i < 3) {
          op = (dur.end - t) / fade;
        }
      }
      scenes[i].style.opacity = op;
      scenes[i].style.display = (op > 0) ? 'inline' : 'none';
    }

    // 2. Slow cinematic camera pan and zoom across 30.0s (Rule 3 & 11)
    // Scale ranges from 1.0 to 1.07. Max horizontal pan bounded to (scale - 1) * 640 = 44.8px
    const p = t / 30000;
    const camZoom = 1.0 + Math.sin(p * Math.PI) * 0.07;
    const maxPanX = (camZoom - 1.0) * 640;
    const camPanX = -maxPanX * Math.sin(p * Math.PI);
    const camPanY = -((camZoom - 1.0) * 360) * Math.sin(p * Math.PI);
    svgStage.style.transform = `translate(${camPanX}px, ${camPanY}px) scale(${camZoom})`;

    // 3. Grounded Deterministic Character Translations (Rule 7)
    // Scene 1: Contesting generals step deliberately toward center
    if (t >= 0 && t <= 7500) {
      const s1t = t / 1000;
      const c1 = document.getElementById('s1-char1');
      const c2 = document.getElementById('s1-char2');
      if (c1) c1.setAttribute('transform', `translate(${240 + Math.sin(s1t * 1.5) * 20}, 360)`);
      if (c2) c2.setAttribute('transform', `translate(${880 - Math.sin(s1t * 1.5) * 20}, 360)`);
    }

    // Scene 2: Builders walking with stone materials across level y=590
    if (t > 7500 && t <= 15000) {
      const s2t = (t - 7500) / 1000;
      const b1 = document.getElementById('s2-char1');
      if (b1) {
        const xPos = 340 + (s2t * 22) % 180;
        b1.setAttribute('transform', `translate(${xPos}, 370)`);
      }
    }

    // Scene 3: Patrol movement along ground level
    if (t > 15000 && t <= 22500) {
      const s3t = (t - 15000) / 1000;
      const g1 = document.getElementById('s3-char1');
      if (g1) {
        const gPos = 300 + (s3t * 24) % 160;
        g1.setAttribute('transform', `translate(${gPos}, 360)`);
      }
    }

    // 4. Deterministic Canvas Atmospheric Overlay (Rule 4)
    ctx.clearRect(0, 0, 1280, 720);
    for (let i = 0; i < NUM_PARTICLES; i++) {
      const pt = particles[i];
      const curX = (pt.xInit + pt.speedX * sec) % 1340 - 30;
      const wave = Math.sin(sec * 2 + pt.phase) * 15;
      const curY = (pt.yInit + pt.speedY * sec + wave) % 760 - 20;

      ctx.beginPath();
      ctx.arc(curX < 0 ? curX + 1300 : curX, curY < 0 ? curY + 740 : curY, pt.size, 0, Math.PI * 2);
      ctx.fillStyle = pt.isEmber
        ? `rgba(255, 120, 40, ${pt.alpha})`
        : `rgba(255, 235, 160, ${pt.alpha * 0.8})`;
      ctx.fill();
    }
  };

  // Initialize at frame 0
  window.updateSceneTime(0);
</script>
