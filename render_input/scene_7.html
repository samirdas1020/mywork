<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Caesarea Concrete & Herod's Paradox</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #090a0f;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
  }
  #viewport {
    position: relative;
    width: 1280px;
    height: 720px;
    background: #000;
    overflow: hidden;
    box-shadow: 0 0 50px rgba(0,0,0,0.9);
  }
  svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 1280px;
    height: 720px;
  }
  canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 1280px;
    height: 720px;
    pointer-events: none;
  }

  /* Articulated Limb Rigging (CSS Keyframes with absolute px joint origins) */
  .worker-arm-l { transform-origin: 26px 36px; animation: pourBucketL 0.8s infinite alternate ease-in-out; }
  .worker-arm-r { transform-origin: 54px 36px; animation: pourBucketR 0.8s infinite alternate ease-in-out; }
  .leg-l-std    { transform-origin: 32px 62px; animation: legLWalk 0.7s infinite alternate ease-in-out; }
  .leg-r-std    { transform-origin: 50px 62px; animation: legRWalk 0.7s infinite alternate ease-in-out; }
  .char-bob     { animation: charBob 0.35s infinite alternate ease-in-out; }

  @keyframes pourBucketL { from { transform: rotate(-10deg); } to { transform: rotate(35deg); } }
  @keyframes pourBucketR { from { transform: rotate(-35deg); } to { transform: rotate(15deg); } }
  @keyframes legLWalk { from { transform: rotate(-16deg); } to { transform: rotate(16deg); } }
  @keyframes legRWalk { from { transform: rotate(16deg); } to { transform: rotate(-16deg); } }
  @keyframes charBob  { from { transform: translateY(0px); } to { transform: translateY(-3.5px); } }

  /* Modern Engineer Rigging */
  .eng-arm-l { transform-origin: 24px 34px; animation: tabletHold 1.4s infinite alternate ease-in-out; }
  .eng-arm-r { transform-origin: 54px 34px; animation: headScratch 1.1s infinite alternate ease-in-out; }
  @keyframes tabletHold  { from { transform: rotate(-10deg); } to { transform: rotate(10deg); } }
  @keyframes headScratch { from { transform: rotate(-50deg); } to { transform: rotate(-80deg); } }

  /* Sea Wave Surge */
  .sea-surge { transform-origin: 640px 480px; animation: surgeAnim 2.2s infinite alternate ease-in-out; }
  @keyframes surgeAnim { from { transform: translateY(0px) scaleY(0.96); } to { transform: translateY(-8px) scaleY(1.03); } }

  /* Scales of Herod's Rule Sway */
  .scale-balance { transform-origin: 640px 240px; animation: swayScale 2.6s infinite alternate ease-in-out; }
  @keyframes swayScale { from { transform: rotate(-8deg); } to { transform: rotate(8deg); } }

  .text-label {
    font-family: 'Impact', 'Arial Black', sans-serif;
    text-shadow: 3px 3px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 0 4px 12px rgba(0,0,0,0.85);
    letter-spacing: 1px;
  }
</style>
</head>
<body>

<div id="viewport">
  <svg id="stage" viewBox="0 0 1280 720">
    <defs>
      <!-- Gradients -->
      <linearGradient id="skySeaStorm" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#075985"/>
        <stop offset="50%" stop-color="#38bdf8"/>
        <stop offset="100%" stop-color="#bae6fd"/>
      </linearGradient>
      <linearGradient id="medSeaGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#0284c7"/>
        <stop offset="40%" stop-color="#0369a1"/>
        <stop offset="100%" stop-color="#082f49"/>
      </linearGradient>
      <linearGradient id="concreteWet" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#64748b"/>
        <stop offset="50%" stop-color="#475569"/>
        <stop offset="100%" stop-color="#1e293b"/>
      </linearGradient>
      <linearGradient id="chemGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#10b981"/>
        <stop offset="50%" stop-color="#06b6d4"/>
        <stop offset="100%" stop-color="#3b82f6"/>
      </linearGradient>
      <linearGradient id="collapseGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#450a0a"/>
        <stop offset="60%" stop-color="#1e1b4b"/>
        <stop offset="100%" stop-color="#020617"/>
      </linearGradient>
    </defs>

    <g id="camera-root">
      <!-- ================= SCENE 0: [0.0s - 5.3s] POURING CONCRETE INTO MEDITERRANEAN WAVES ================= -->
      <g class="scene" id="scene-0">
        <rect x="-100" y="-100" width="1480" height="920" fill="url(#skySeaStorm)"/>
        <!-- Crashing Coastal Waves -->
        <g class="sea-surge">
          <path d="M-80,480 Q140,420 380,470 Q620,520 860,460 Q1120,410 1380,470 L1380,750 L-80,750 Z" fill="url(#medSeaGrad)"/>
          <path d="M-80,530 Q220,490 540,540 Q840,490 1140,530 L1380,510 L1380,750 L-80,750 Z" fill="#0c4a6e" opacity="0.6"/>
          <!-- Wave Crest Foam -->
          <path d="M-60,476 Q140,414 380,466 Q620,516 860,456 Q1120,406 1360,466" stroke="#ffffff" stroke-width="8" fill="none" stroke-linecap="round"/>
        </g>

        <!-- Wooden Staging Pier / Barge Platform -->
        <g transform="translate(180, 360)">
          <rect x="0" y="70" width="360" height="26" fill="#78350f" stroke="#451a03" stroke-width="3"/>
          <line x1="40" y1="96" x2="40" y2="340" stroke="#451a03" stroke-width="12"/>
          <line x1="160" y1="96" x2="160" y2="340" stroke="#451a03" stroke-width="12"/>
          <line x1="280" y1="96" x2="280" y2="340" stroke="#451a03" stroke-width="12"/>
        </g>

        <!-- Rigged Herod's Harbor Mason Pouring Wet Pozzolana Slurry directly into sea -->
        <g class="char-bob" transform="translate(460, 310) scale(1.3)">
          <g class="leg-l-std">
            <rect x="26" y="58" width="13" height="48" rx="4" fill="#fed7aa"/>
            <rect x="22" y="98" width="22" height="10" rx="3" fill="#78350f"/>
          </g>
          <g class="leg-r-std">
            <rect x="44" y="58" width="13" height="48" rx="4" fill="#fed7aa"/>
            <rect x="40" y="98" width="22" height="10" rx="3" fill="#78350f"/>
          </g>
          <!-- Worker Linen Tunic -->
          <rect x="20" y="24" width="40" height="40" rx="6" fill="#b45309"/>
          <!-- Head with Sun Cloth Wrap -->
          <circle cx="40" cy="12" r="14" fill="#fed7aa"/>
          <circle cx="45" cy="11" r="2.5" fill="#0f172a"/>
          <rect x="26" y="6" width="30" height="8" rx="3" fill="#ca8a04"/>
          <!-- Arms Holding Big Concrete Pour Bucket -->
          <g class="worker-arm-l">
            <rect x="16" y="24" width="12" height="30" rx="4" fill="#b45309"/>
          </g>
          <g class="worker-arm-r">
            <rect x="50" y="24" width="12" height="30" rx="4" fill="#b45309"/>
            <!-- Tilted Clay Cauldron / Vat -->
            <polygon points="45,46 75,34 85,62 55,74" fill="#78350f"/>
            <!-- Liquid Concrete Gush into Ocean -->
            <path d="M78,50 Q110,80 100,160 Q85,160 70,110 Z" fill="url(#concreteWet)"/>
          </g>
        </g>

        <!-- Splash & Chemical Fume Cloud at Impact Point -->
        <g transform="translate(580, 480)">
          <ellipse cx="0" cy="0" rx="45" ry="18" fill="#e0f2fe" opacity="0.8"/>
          <circle cx="-25" cy="-20" r="12" fill="#ffffff" opacity="0.7"/>
          <circle cx="20" cy="-25" r="16" fill="#ffffff" opacity="0.7"/>
          <circle cx="0" cy="-35" r="20" fill="#bae6fd" opacity="0.5"/>
        </g>

        <!-- Titles -->
        <g transform="translate(640, 105)">
          <rect x="-340" y="-45" width="680" height="90" rx="16" fill="#000" opacity="0.85" stroke="#38bdf8" stroke-width="2"/>
          <text class="text-label" x="0" y="2" text-anchor="middle" fill="#38bdf8" font-size="38">POURING CONCRETE INTO WAVES</text>
          <text class="text-label" x="0" y="34" text-anchor="middle" fill="#ffffff" font-size="20">THE CRASHING MEDITERRANEAN SEA (CAESAREA)</text>
        </g>
      </g>

      <!-- ================= SCENE 1: [5.3s - 11.5s] CHEMICAL TRICK / CONFUSES MODERN ENGINEERS ================= -->
      <!-- Timed: [5.3-8.3s] chemical trick, [8.3-11.5s] still confuses modern engineers today -->
      <g class="scene" id="scene-1">
        <rect x="-100" y="-100" width="1480" height="920" fill="#0b1329"/>

        <!-- High-Tech Laboratory / Geological Molecular Overlay -->
        <circle cx="360" cy="380" r="220" fill="none" stroke="#06b6d4" stroke-width="2" stroke-dasharray="8,6" opacity="0.5"/>
        <!-- Chemical Molecular Grid (Al-Tobermorite Crystal Formula) -->
        <g transform="translate(360, 380)">
          <!-- Hexagonal Crystal Matrix -->
          <polygon points="0,-90 78,-45 78,45 0,90 -78,45 -78,-45" fill="none" stroke="#10b981" stroke-width="3"/>
          <polygon points="0,-50 43,-25 43,25 0,50 -43,25 -43,-25" fill="url(#chemGrad)" opacity="0.4"/>
          <circle cx="0" cy="-90" r="12" fill="#38bdf8"/>
          <circle cx="78" cy="-45" r="12" fill="#38bdf8"/>
          <circle cx="78" cy="45" r="12" fill="#38bdf8"/>
          <circle cx="0" cy="90" r="12" fill="#38bdf8"/>
          <circle cx="-78" cy="45" r="12" fill="#38bdf8"/>
          <circle cx="-78" cy="-45" r="12" fill="#38bdf8"/>
          <text class="text-label" x="0" y="8" text-anchor="middle" fill="#ffffff" font-size="24">Al-TOBERMORITE</text>
          <text class="text-label" x="0" y="30" text-anchor="middle" fill="#facc15" font-size="14">VOLCANIC ASH + SEAWATER</text>
        </g>

        <!-- Modern Engineer Rigged Character (Right) Scratching Head in Utter Confusion -->
        <g class="char-bob" transform="translate(860, 370) scale(1.35)">
          <!-- Modern Work Chinos -->
          <g class="leg-l-std">
            <rect x="26" y="58" width="13" height="50" rx="4" fill="#334155"/>
            <rect x="22" y="100" width="22" height="12" rx="4" fill="#1e293b"/>
          </g>
          <g class="leg-r-std">
            <rect x="44" y="58" width="13" height="50" rx="4" fill="#334155"/>
            <rect x="40" y="100" width="22" height="12" rx="4" fill="#1e293b"/>
          </g>
          <!-- Modern Hi-Vis Vest & Polo -->
          <rect x="20" y="24" width="40" height="40" rx="6" fill="#0284c7"/>
          <rect x="24" y="24" width="12" height="40" fill="#facc15"/>
          <rect x="44" y="24" width="12" height="40" fill="#facc15"/>
          <!-- Engineer Head & White Hardhat -->
          <circle cx="40" cy="12" r="13" fill="#fed7aa"/>
          <circle cx="45" cy="12" r="2.5" fill="#0f172a"/>
          <!-- Perplexed / Confused Mouth -->
          <circle cx="43" cy="18" r="3" fill="#0f172a"/>
          <!-- Hardhat -->
          <path d="M22,10 Q40,-6 58,10 L62,14 L18,14 Z" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
          <!-- Arm holding Blueprint Tablet -->
          <g class="eng-arm-l">
            <rect x="16" y="24" width="12" height="30" rx="4" fill="#0284c7"/>
            <rect x="4" y="32" width="26" height="34" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
          </g>
          <!-- Arm Scratching Head in Bafflement -->
          <g class="eng-arm-r">
            <rect x="48" y="24" width="12" height="30" rx="4" fill="#0284c7"/>
            <circle cx="50" cy="6" r="6" fill="#fed7aa"/>
          </g>
        </g>

        <!-- Big Question Marks -->
        <text class="text-label" x="960" y="300" fill="#facc15" font-size="52">?</text>
        <text class="text-label" x="1000" y="260" fill="#38bdf8" font-size="42">?</text>

        <!-- Titles -->
        <g transform="translate(640, 105)">
          <rect x="-330" y="-45" width="660" height="90" rx="16" fill="#000" opacity="0.85" stroke="#10b981" stroke-width="2"/>
          <text class="text-label" x="0" y="2" text-anchor="middle" fill="#10b981" font-size="38">ANCIENT CHEMICAL TRICK</text>
          <text class="text-label" x="0" y="34" text-anchor="middle" fill="#ffffff" font-size="20">STILL CONFUSES MODERN ENGINEERS TODAY</text>
        </g>
      </g>

      <!-- ================= SCENE 2: [11.5s - 19.1s] HARDENED UNDERWATER / MASSIVE BREAKWATERS ================= -->
      <!-- Timed: [11.5-13.9s] hardened underwater, [13.9-16.2s] form massive breakwaters, [16.2-18.0s] incredible feat, [18.0-19.1s] Truly -->
      <g class="scene" id="scene-2">
        <rect x="-100" y="-100" width="1480" height="920" fill="url(#skySeaStorm)"/>
        <!-- Clear Mediterranean Water Cross-Section -->
        <rect x="-80" y="340" width="1440" height="410" fill="url(#medSeaGrad)"/>
        <line x1="-80" y1="340" x2="1380" y2="340" stroke="#38bdf8" stroke-width="4"/>

        <!-- The Colossal Monolithic Underwater Breakwater Mole (Growing in place) -->
        <g id="massive-breakwater" transform="translate(640, 520)">
          <!-- Underwater Bedrock Foundation -->
          <polygon points="-460,180 -380,40 380,40 460,180" fill="#334155" stroke="#1e293b" stroke-width="4"/>
          <!-- Hardened Pozzolanic Concrete Blocks -->
          <rect x="-340" y="-40" width="680" height="120" rx="8" fill="url(#concreteWet)" stroke="#1e293b" stroke-width="4"/>
          <line x1="-170" y1="-40" x2="-170" y2="80" stroke="#1e293b" stroke-width="3"/>
          <line x1="0" y1="-40" x2="0" y2="80" stroke="#1e293b" stroke-width="3"/>
          <line x1="170" y1="-40" x2="170" y2="80" stroke="#1e293b" stroke-width="3"/>
          <!-- Above-water Quay Terrace & Lighthouse Tower -->
          <rect x="-240" y="-120" width="480" height="80" fill="#e2e8f0" stroke="#94a3b8" stroke-width="3"/>
          <!-- Colonnade along breakwater -->
          <rect x="-200" y="-180" width="14" height="60" fill="#cbd5e1"/>
          <rect x="-100" y="-180" width="14" height="60" fill="#cbd5e1"/>
          <rect x="0" y="-180" width="14" height="60" fill="#cbd5e1"/>
          <rect x="100" y="-180" width="14" height="60" fill="#cbd5e1"/>
          <rect x="200" y="-180" width="14" height="60" fill="#cbd5e1"/>
          <rect x="-220" y="-195" width="440" height="16" fill="#f1f5f9"/>
        </g>

        <!-- Safe Harbor Calm Waters inside Breakwater vs Crashing Waves Outside -->
        <text class="text-label" x="220" y="440" fill="#ef4444" font-size="24">CRASHING SEAS</text>
        <text class="text-label" x="1040" y="440" fill="#10b981" font-size="24">CALM HARBOR</text>

        <!-- Engineering Stamp of Triumph -->
        <g transform="translate(640, 105)">
          <rect x="-320" y="-45" width="640" height="90" rx="16" fill="#000" opacity="0.85" stroke="#facc15" stroke-width="2"/>
          <text class="text-label" x="0" y="2" text-anchor="middle" fill="#facc15" font-size="38">MASSIVE UNDERWATER BREAKWATERS</text>
          <text class="text-label" x="0" y="34" text-anchor="middle" fill="#ffffff" font-size="20">AN INCREDIBLE FEAT OF ENGINEERING</text>
        </g>
      </g>

      <!-- ================= SCENE 3: [19.1s - 26.2s] HEROD'S BIZARRE MIXTURE: TERROR & VISION ================= -->
      <!-- Timed: [19.1-22.1s] Herod kept peace through bizarre mixture, [22.1-26.2s] absolute terror and visionary building projects -->
      <g class="scene" id="scene-3">
        <rect x="-100" y="-100" width="1480" height="920" fill="#0f172a"/>

        <!-- The Great Balancing Scale of Herod's Reign -->
        <g class="scale-balance">
          <!-- Balance Beam -->
          <line x1="280" y1="240" x2="1000" y2="240" stroke="#facc15" stroke-width="10" stroke-linecap="round"/>
          <polygon points="640,200 620,240 660,240" fill="#ca8a04"/>

          <!-- Left Pan: ABSOLUTE TERROR (Dagger, Skull, Cage) -->
          <g transform="translate(360, 240)">
            <line x1="0" y1="0" x2="-70" y2="120" stroke="#cbd5e1" stroke-width="3"/>
            <line x1="0" y1="0" x2="70" y2="120" stroke="#cbd5e1" stroke-width="3"/>
            <path d="M-90,120 Q0,160 90,120 Z" fill="#7f1d1d" stroke="#ef4444" stroke-width="3"/>
            <!-- Skull / Threat Emblem -->
            <circle cx="0" cy="70" r="28" fill="#f8fafc"/>
            <ellipse cx="-9" cy="68" rx="6" ry="8" fill="#000"/>
            <ellipse cx="9" cy="68" rx="6" ry="8" fill="#000"/>
            <line x1="-30" y1="100" x2="30" y2="40" stroke="#dc2626" stroke-width="5"/>
            <text class="text-label" x="0" y="195" text-anchor="middle" fill="#ef4444" font-size="28">ABSOLUTE TERROR</text>
          </g>

          <!-- Right Pan: VISIONARY PROJECTS (Temple & Harbor Models) -->
          <g transform="translate(920, 240)">
            <line x1="0" y1="0" x2="-70" y2="120" stroke="#cbd5e1" stroke-width="3"/>
            <line x1="0" y1="0" x2="70" y2="120" stroke="#cbd5e1" stroke-width="3"/>
            <path d="M-90,120 Q0,160 90,120 Z" fill="#1e3a8a" stroke="#38bdf8" stroke-width="3"/>
            <!-- Temple Façade Model -->
            <polygon points="-40,90 0,50 40,90" fill="#facc15"/>
            <rect x="-35" y="90" width="70" height="25" fill="#e2e8f0"/>
            <text class="text-label" x="0" y="195" text-anchor="middle" fill="#38bdf8" font-size="28">VISIONARY PROJECTS</text>
          </g>
        </g>

        <!-- Herod Center Figure Maintaining the Precarious Balance -->
        <g class="char-bob" transform="translate(640, 440) scale(1.35)">
          <rect x="-24" y="58" width="13" height="48" rx="4" fill="#ca8a04"/>
          <rect x="11" y="58" width="13" height="48" rx="4" fill="#ca8a04"/>
          <!-- Purple & Gold Split Robe -->
          <rect x="-26" y="22" width="52" height="44" rx="6" fill="#581c87"/>
          <circle cx="0" cy="11" r="14" fill="#fed7aa"/>
          <polygon points="-14,5 -9,-6 -4,1 0,-7 4,1 9,-6 14,5" fill="#facc15"/>
          <circle cx="-4" cy="10" r="2.5" fill="#0f172a"/>
          <circle cx="5" cy="10" r="2.5" fill="#0f172a"/>
          <!-- Arms stretched wide holding each side of scale -->
          <line x1="-24" y1="34" x2="-65" y2="15" stroke="#581c87" stroke-width="12" stroke-linecap="round"/>
          <line x1="24" y1="34" x2="65" y2="15" stroke="#581c87" stroke-width="12" stroke-linecap="round"/>
        </g>

        <!-- Titles -->
        <g transform="translate(640, 95)">
          <rect x="-310" y="-45" width="620" height="90" rx="16" fill="#000" opacity="0.9" stroke="#facc15" stroke-width="2"/>
          <text class="text-label" x="0" y="2" text-anchor="middle" fill="#facc15" font-size="38">A BIZARRE CONTRADICTION</text>
          <text class="text-label" x="0" y="34" text-anchor="middle" fill="#ffffff" font-size="20">TYRANNY BALANCED WITH ARCHITECTURAL GENIUS</text>
        </g>
      </g>

      <!-- ================= SCENE 4: [26.2s - 30.0s] WHAT CAUSED IT ALL TO FINALLY COLLAPSE? ================= -->
      <!-- Timed: [26.2-29.9s] What was mechanism that caused it all to finally collapse? -->
      <g class="scene" id="scene-4">
        <rect x="-100" y="-100" width="1480" height="920" fill="url(#collapseGrad)"/>

        <!-- Massive Cracking Pillars / Crumbling Palace Arch -->
        <g id="crumbling-structure" transform="translate(640, 380)">
          <!-- Left Pillar fracturing outward -->
          <g id="pillar-left" transform="translate(-240, 0)">
            <rect x="-30" y="-160" width="60" height="320" fill="#e2e8f0" stroke="#94a3b8" stroke-width="3"/>
            <!-- Fracture zigzag line -->
            <path d="M-30,-40 L0,-10 L-10,30 L30,60" stroke="#ef4444" stroke-width="5" fill="none"/>
          </g>
          <!-- Right Pillar fracturing outward -->
          <g id="pillar-right" transform="translate(240, 0)">
            <rect x="-30" y="-160" width="60" height="320" fill="#e2e8f0" stroke="#94a3b8" stroke-width="3"/>
            <path d="M30,-60 L-10,-20 L10,20 L-30,70" stroke="#ef4444" stroke-width="5" fill="none"/>
          </g>
          <!-- Giant Arch / Pediment splitting in half -->
          <g id="arch-top" transform="translate(0, -180)">
            <polygon points="-320,0 0,-100 320,0" fill="#cbd5e1" stroke="#64748b" stroke-width="4"/>
            <!-- Crack right down middle -->
            <path d="M0,-100 L-15,-40 L15,0" stroke="#ef4444" stroke-width="7" fill="none"/>
          </g>
        </g>

        <!-- Giant Dramatic Question Callout -->
        <g transform="translate(640, 390)">
          <circle cx="0" cy="0" r="90" fill="#000" opacity="0.8" stroke="#ef4444" stroke-width="5"/>
          <text class="text-label" x="0" y="28" text-anchor="middle" fill="#ef4444" font-size="80">?</text>
        </g>

        <!-- Final Cliffhanger Header -->
        <g transform="translate(640, 105)">
          <rect x="-340" y="-45" width="680" height="90" rx="16" fill="#000" opacity="0.9" stroke="#ef4444" stroke-width="3"/>
          <text class="text-label" x="0" y="2" text-anchor="middle" fill="#ef4444" font-size="36">WHAT CAUSED THE COLLAPSE?</text>
          <text class="text-label" x="0" y="34" text-anchor="middle" fill="#fef08a" font-size="20">WHEN THE ILLUSION OF STABILITY CRUMBLES</text>
        </g>
      </g>
    </g>
  </svg>

  <!-- Atmospheric Canvas Particles (Salt Spray, Concrete Dust & Sparks) -->
  <canvas id="ambientCanvas" width="1280" height="720"></canvas>
</div>

<script>
  /* ================= Deterministic Particle Setup (Rule 4 & 9) ================= */
  let seed = 44921;
  function seededRand() {
    seed = (seed * 9301 + 49297) % 233280;
    return seed / 233280;
  }

  const canvas = document.getElementById("ambientCanvas");
  const ctx = canvas.getContext("2d");
  const PARTICLE_COUNT = 80;
  const particles = [];

  for (let i = 0; i < PARTICLE_COUNT; i++) {
    particles.push({
      x: seededRand() * 1280,
      y: seededRand() * 720,
      vx: 0.06 + seededRand() * 0.14,
      vy: -0.04 - seededRand() * 0.08,
      r: 1.2 + seededRand() * 2.4,
      alpha: 0.25 + seededRand() * 0.5
    });
  }

  /* ================= Deterministic Clock Function (Rule 5 & 8) ================= */
  // Merged short sentences into neighbouring scenes across exactly 30.0s (30,000ms):
  // Scene 0: [0.0s - 5.3s]   (0 - 5300ms)     Pouring concrete into crashing Mediterranean waves
  // Scene 1: [5.3s - 11.5s]  (5300 - 11500ms) Chemical trick still confuses modern engineers today
  // Scene 2: [11.5s - 19.1s] (11500 - 19100ms) Hardened underwater to form massive breakwaters (feat of engineering)
  // Scene 3: [19.1s - 26.2s] (19100 - 26200ms) Bizarre mixture: absolute terror & visionary building projects
  // Scene 4: [26.2s - 30.0s] (26200 - 30000ms) What was the mechanism that caused it all to collapse?
  const scenes = [
    { id: "scene-0", start: 0,     end: 5300 },
    { id: "scene-1", start: 5300,  end: 11500 },
    { id: "scene-2", start: 11500, end: 19100 },
    { id: "scene-3", start: 19100, end: 26200 },
    { id: "scene-4", start: 26200, end: 30000 }
  ];

  const cameraRoot = document.getElementById("camera-root");
  const breakwater = document.getElementById("massive-breakwater");
  const pillarLeft = document.getElementById("pillar-left");
  const pillarRight = document.getElementById("pillar-right");
  const archTop = document.getElementById("arch-top");

  window.updateSceneTime = function(t_ms) {
    const t = Math.max(0, Math.min(30000, t_ms));
    const FADE = 400; // 0.4s clean crossfade

    // 1. Scene Visibility & Cross-fade (Deterministic)
    scenes.forEach(sc => {
      const el = document.getElementById(sc.id);
      if (!el) return;

      if (t < sc.start || t > sc.end) {
        el.style.display = "none";
        el.style.opacity = 0;
      } else {
        el.style.display = "inline";
        let opacity = 1;
        if (t - sc.start < FADE && sc.start !== 0) {
          opacity = (t - sc.start) / FADE;
        } else if (sc.end - t < FADE && sc.end !== 30000) {
          opacity = (sc.end - t) / FADE;
        }
        el.style.opacity = opacity;
      }
    });

    // 2. Slow Cinematic Camera Pan / Zoom across 30 seconds
    const progress = t / 30000;
    const camX = -progress * 46;
    const camY = Math.sin(progress * Math.PI) * -12;
    const camScale = 1.0 + (progress * 0.045);
    cameraRoot.setAttribute("transform", `translate(${camX}, ${camY}) scale(${camScale})`);

    // 3. Scene-Specific Deterministic Logic
    // Scene 2: Massive breakwater rising up from seabed
    if (breakwater && t >= 11500 && t <= 19100) {
      const riseProgress = Math.min(1, (t - 11500) / 4500);
      const riseY = (1 - riseProgress) * 45;
      breakwater.setAttribute("transform", `translate(640, ${520 + riseY})`);
    }

    // Scene 4: Pillars crumbling and separating [26.2s - 30.0s]
    if (t >= 26200) {
      const collapseProgress = (t - 26200) / 3800;
      const shiftX = collapseProgress * 28;
      const rot = collapseProgress * 5;
      if (pillarLeft) pillarLeft.setAttribute("transform", `translate(${-240 - shiftX}, 0) rotate(${-rot})`);
      if (pillarRight) pillarRight.setAttribute("transform", `translate(${240 + shiftX}, 0) rotate(${rot})`);
      if (archTop) archTop.setAttribute("transform", `translate(0, ${-180 + collapseProgress * 30})`);
    }

    // 4. Atmospheric Canvas Particles (Sea spray, dust, embers)
    ctx.clearRect(0, 0, 1280, 720);
    for (let i = 0; i < PARTICLE_COUNT; i++) {
      const p = particles[i];
      const px = (p.x + t * p.vx) % 1280;
      const py = (p.y + t * p.vy + 720000) % 720;
      const shimmer = Math.sin(t * 0.004 + i) * 1.5;

      // Color tints: blue ocean salt spray in early scenes, crimson dust in collapse
      ctx.fillStyle = (t >= 26200) ? "#ef4444" : ((t >= 5300 && t <= 11500) ? "#38bdf8" : "#e0f2fe");
      ctx.globalAlpha = p.alpha * (0.6 + 0.4 * Math.sin(t * 0.003 + i));
      ctx.beginPath();
      ctx.arc(px + shimmer, py, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
  };

  // Initial render at t = 0
  window.updateSceneTime(0);
</script>
</body>
