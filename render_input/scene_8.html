<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Collapse: Incompetence, Greed, and the Desecration</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #090a0f;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
  }
  #viewport {
    position: relative;
    width: 1280px;
    height: 720px;
    background: #000;
    overflow: hidden;
    box-shadow: 0 0 50px rgba(0,0,0,0.9);
  }
  svg {
    position: absolute;
    top: 0;
    left: 0;
    width: 1280px;
    height: 720px;
  }
  canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 1280px;
    height: 720px;
    pointer-events: none;
  }

  /* Articulated Limb Rigging (CSS Keyframes with absolute px joint origins) */
  .walk-leg-l { transform-origin: 30px 62px; animation: legL 0.65s infinite alternate ease-in-out; }
  .walk-leg-r { transform-origin: 52px 62px; animation: legR 0.65s infinite alternate ease-in-out; }
  .walk-arm-l { transform-origin: 24px 34px; animation: armL 0.65s infinite alternate ease-in-out; }
  .walk-arm-r { transform-origin: 56px 34px; animation: armR 0.65s infinite alternate ease-in-out; }
  .char-bob   { animation: bob 0.325s infinite alternate ease-in-out; }

  @keyframes legL { from { transform: rotate(-22deg); } to { transform: rotate(22deg); } }
  @keyframes legR { from { transform: rotate(22deg); } to { transform: rotate(-22deg); } }
  @keyframes armL { from { transform: rotate(24deg); } to { transform: rotate(-24deg); } }
  @keyframes armR { from { transform: rotate(-24deg); } to { transform: rotate(24deg); } }
  @keyframes bob  { from { transform: translateY(0px); } to { transform: translateY(-3.5px); } }

  /* Corrupt Governor Coin-Clutch Rigging */
  .governor-arm-coin { transform-origin: 56px 34px; animation: coinClutch 0.9s infinite alternate ease-in-out; }
  .governor-arm-grab { transform-origin: 24px 34px; animation: coinGrab 1.1s infinite alternate ease-in-out; }
  @keyframes coinClutch { from { transform: rotate(-15deg); } to { transform: rotate(-45deg); } }
  @keyframes coinGrab   { from { transform: rotate(10deg); } to { transform: rotate(-25deg); } }

  /* Incompetent Ruler Shiver */
  .ruler-wobble { transform-origin: 40px 50px; animation: wobble 0.4s infinite alternate ease-in-out; }
  @keyframes wobble { from { transform: rotate(-4deg); } to { transform: rotate(4deg); } }

  /* Marching Desecrator Arm */
  .florus-sword { transform-origin: 56px 32px; animation: swordGrip 0.7s infinite alternate ease-in-out; }
  @keyframes swordGrip { from { transform: rotate(15deg); } to { transform: rotate(-25deg); } }

  .text-label {
    font-family: 'Impact', 'Arial Black', sans-serif;
    text-shadow: 3px 3px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 0 4px 12px rgba(0,0,0,0.85);
    letter-spacing: 1px;
  }
</style>
</head>
<body>

<div id="viewport">
  <svg id="stage" viewBox="0 0 1280 720">
    <defs>
      <!-- Gradients -->
      <linearGradient id="palaceRuinSky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#450a0a"/>
        <stop offset="50%" stop-color="#78350f"/>
        <stop offset="100%" stop-color="#ea580c"/>
      </linearGradient>
      <linearGradient id="goldCoins" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#fef08a"/>
        <stop offset="50%" stop-color="#facc15"/>
        <stop offset="100%" stop-color="#b45309"/>
      </linearGradient>
      <linearGradient id="starveSky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#020617"/>
        <stop offset="60%" stop-color="#1e1b4b"/>
        <stop offset="100%" stop-color="#312e81"/>
      </linearGradient>
      <linearGradient id="templeSky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#7f1d1d"/>
        <stop offset="50%" stop-color="#b91c1c"/>
        <stop offset="100%" stop-color="#f59e0b"/>
      </linearGradient>
      <linearGradient id="templeSanctuary" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#fef08a"/>
        <stop offset="50%" stop-color="#ca8a04"/>
        <stop offset="100%" stop-color="#78350f"/>
      </linearGradient>
    </defs>

    <g id="camera-root">
      <!-- ================= SCENE 0: [0.0s - 8.0s] THE COLLAPSE & INCOMPETENT SUCCESSORS ================= -->
      <!-- Timed: [0.0-2.2s] collapse happened, [2.2-5.6s] followed Herod lacked competence, [5.6-8.0s] couldn't hold it together -->
      <g class="scene" id="scene-0">
        <rect x="-100" y="-100" width="1480" height="920" fill="url(#palaceRuinSky)"/>
        <!-- Shattered Crown & Tilting Throne -->
        <g transform="translate(640, 480)">
          <path d="M-500,100 L500,100 L440,240 L-460,240 Z" fill="#292524"/>
          <!-- Collapsing Platform Tiles -->
          <line x1="-300" y1="100" x2="-280" y2="240" stroke="#1c1917" stroke-width="4"/>
          <line x1="0" y1="100" x2="20" y2="240" stroke="#1c1917" stroke-width="4"/>
          <line x1="300" y1="100" x2="320" y2="240" stroke="#1c1917" stroke-width="4"/>
          <!-- Broken Column -->
          <polygon points="340,100 390,100 370,-120 320,-120" fill="#78350f" opacity="0.7"/>
          <line x1="330" y1="-20" x2="380" y2="30" stroke="#451a03" stroke-width="4"/>
        </g>

        <!-- Tilting Throne of the Tetrarchs -->
        <g transform="translate(640, 390) rotate(14)">
          <rect x="-80" y="-110" width="160" height="210" rx="10" fill="#78350f" stroke="#ca8a04" stroke-width="4"/>
          <polygon points="0,-140 -50,-110 50,-110" fill="#facc15"/>
        </g>

        <!-- Incompetent Successor (Herod Archelaus) Dropping Scepter & Panicking -->
        <g class="char-bob ruler-wobble" transform="translate(620, 330) scale(1.35)">
          <g class="walk-leg-l">
            <rect x="26" y="58" width="13" height="48" rx="4" fill="#fed7aa"/>
            <rect x="22" y="98" width="22" height="10" rx="3" fill="#ca8a04"/>
          </g>
          <g class="walk-leg-r">
            <rect x="44" y="58" width="13" height="48" rx="4" fill="#fed7aa"/>
            <rect x="40" y="98" width="22" height="10" rx="3" fill="#ca8a04"/>
          </g>
          <!-- Ill-fitting oversize purple mantle -->
          <rect x="18" y="24" width="44" height="42" rx="6" fill="#7e22ce"/>
          <!-- Slanted, crooked crown slipping off head -->
          <circle cx="40" cy="12" r="14" fill="#fed7aa"/>
          <circle cx="44" cy="11" r="2.5" fill="#0f172a"/>
          <!-- Wide panic eyes and wavy nervous mouth -->
          <ellipse cx="44" cy="11" rx="4" ry="5" fill="#ffffff"/>
          <circle cx="44" cy="11" r="2" fill="#000"/>
          <path d="M34,18 Q40,15 46,18" stroke="#000" stroke-width="2" fill="none"/>
          <!-- Falling crooked crown -->
          <g transform="translate(42, 2) rotate(22)">
            <polygon points="-14,0 -9,-10 -4,-2 0,-12 4,-2 9,-10 14,0" fill="#facc15" stroke="#ca8a04"/>
          </g>
          <!-- Flailing Incompetent Limbs -->
          <g class="walk-arm-l">
            <rect x="14" y="24" width="12" height="28" rx="4" fill="#7e22ce"/>
            <circle cx="20" cy="48" r="5" fill="#fed7aa"/>
          </g>
          <g class="walk-arm-r">
            <rect x="52" y="24" width="12" height="28" rx="4" fill="#7e22ce"/>
            <!-- Dropped Scepter tumbling -->
            <line x1="58" y1="46" x2="78" y2="76" stroke="#facc15" stroke-width="3"/>
            <circle cx="80" cy="78" r="5" fill="#dc2626"/>
          </g>
        </g>

        <!-- Titles -->
        <g transform="translate(640, 105)">
          <rect x="-310" y="-45" width="620" height="90" rx="16" fill="#000" opacity="0.85" stroke="#ef4444" stroke-width="2"/>
          <text class="text-label" x="0" y="2" text-anchor="middle" fill="#ef4444" font-size="38">THE SYSTEM COLLAPSES</text>
          <text class="text-label" x="0" y="34" text-anchor="middle" fill="#fef08a" font-size="20">LACKING HEROD'S RUTHLESS COMPETENCE</text>
        </g>
      </g>

      <!-- ================= SCENE 1: [8.0s - 15.6s] GREEDY & CULTURALLY TONE-DEAF GOVERNORS ================= -->
      <!-- Timed: [8.0-10.8s] Rome sent governors, [10.8-12.5s] incredibly greedy, [12.5-15.6s] completely toned off to local culture -->
      <g class="scene" id="scene-1">
        <rect x="-100" y="-100" width="1480" height="920" fill="#0f172a"/>
        <!-- Roman Provincial Governor's Tax Counting Room -->
        <rect x="180" y="220" width="920" height="340" rx="12" fill="#1e293b" stroke="#334155" stroke-width="4"/>
        <line x1="200" y1="360" x2="1080" y2="360" stroke="#475569" stroke-width="4"/>

        <!-- Massive Stacks of Plundered Gold Coins & Tax Chests -->
        <g transform="translate(740, 430)">
          <!-- Iron Strongbox Chest -->
          <rect x="0" y="20" width="220" height="130" rx="6" fill="#78350f" stroke="#000" stroke-width="4"/>
          <rect x="10" y="26" width="200" height="15" fill="#ca8a04"/>
          <circle cx="110" cy="80" r="14" fill="#facc15"/>
          <!-- Overflowing Mountain of Gold Coins -->
          <ellipse cx="110" cy="20" rx="90" ry="32" fill="url(#goldCoins)"/>
          <circle cx="60" cy="10" r="10" fill="#fde047" stroke="#ca8a04"/>
          <circle cx="90" cy="-5" r="10" fill="#fde047" stroke="#ca8a04"/>
          <circle cx="120" cy="0" r="10" fill="#fde047" stroke="#ca8a04"/>
          <circle cx="150" cy="10" r="10" fill="#fde047" stroke="#ca8a04"/>
        </g>

        <!-- Corrupt Greedy Roman Procurator (e.g. Gessius Florus / Albinus) -->
        <g class="char-bob" transform="translate(440, 350) scale(1.35)">
          <!-- Legs -->
          <g class="walk-leg-l">
            <rect x="26" y="58" width="13" height="48" rx="4" fill="#fed7aa"/>
            <rect x="22" y="98" width="22" height="10" rx="3" fill="#78350f"/>
          </g>
          <g class="walk-leg-r">
            <rect x="44" y="58" width="13" height="48" rx="4" fill="#fed7aa"/>
            <rect x="40" y="98" width="22" height="10" rx="3" fill="#78350f"/>
          </g>
          <!-- Ornate Red Governor Toga & Gold Bulla -->
          <rect x="20" y="24" width="40" height="42" rx="6" fill="#991b1b"/>
          <path d="M20,24 L44,66 L60,24 Z" fill="#dc2626"/>
          <circle cx="40" cy="40" r="6" fill="#facc15"/>
          <!-- Arrogant, Sneering Head with Golden Laurel -->
          <circle cx="40" cy="12" r="14" fill="#fed7aa"/>
          <circle cx="45" cy="11" r="2.5" fill="#0f172a"/>
          <!-- Smirk -->
          <path d="M38,18 Q44,20 48,16" stroke="#000" stroke-width="2" fill="none"/>
          <path d="M26,8 Q40,-2 54,8" stroke="#ca8a04" stroke-width="3" fill="none"/>
          <!-- Left Arm Grabbing Money Bag -->
          <g class="governor-arm-grab">
            <rect x="16" y="24" width="12" height="30" rx="4" fill="#991b1b"/>
            <!-- Sacks of Denarii -->
            <path d="M4,44 Q14,32 24,44 L26,60 L2,60 Z" fill="#d97706" stroke="#78350f"/>
            <text x="14" y="56" font-family="Arial Black" font-size="9" fill="#fef08a" text-anchor="middle">$</text>
          </g>
          <!-- Right Arm Clutching Piles of Gold -->
          <g class="governor-arm-coin">
            <rect x="48" y="24" width="12" height="30" rx="4" fill="#991b1b"/>
            <circle cx="62" cy="46" r="10" fill="#facc15" stroke="#ca8a04" stroke-width="2"/>
          </g>
        </g>

        <!-- Ear Plugs / Tone Deaf Indicator Vector -->
        <g transform="translate(480, 310)">
          <circle cx="45" cy="10" r="16" fill="none" stroke="#ef4444" stroke-width="3"/>
          <line x1="34" y1="-2" x2="56" y2="22" stroke="#ef4444" stroke-width="3"/>
        </g>

        <!-- Titles -->
        <g transform="translate(640, 105)">
          <rect x="-310" y="-45" width="620" height="90" rx="16" fill="#000" opacity="0.85" stroke="#facc15" stroke-width="2"/>
          <text class="text-label" x="0" y="2" text-anchor="middle" fill="#facc15" font-size="38">GREEDY ROMAN PROCURATORS</text>
          <text class="text-label" x="0" y="34" text-anchor="middle" fill="#ffffff" font-size="20">EXTORTION & CULTURAL BLINDNESS</text>
        </g>
      </g>

      <!-- ================= SCENE 2: [15.6s - 22.0s] TAXED INTO THE GROUND / STARVATION ================= -->
      <!-- Timed: [15.6-17.4s] taxing people into ground, [17.4-18.4s] relentlessly, [18.4-22.0s] point of outright starvation -->
      <g class="scene" id="scene-2">
        <rect x="-100" y="-100" width="1480" height="920" fill="url(#starveSky)"/>
        <!-- Barren, Drought-stricken Judean Soil -->
        <path d="M-80,560 Q400,520 1380,560 L1380,750 L-80,750 Z" fill="#292524"/>
        <path d="M-80,620 Q500,590 1380,610 L1380,750 L-80,750 Z" fill="#1c1917"/>

        <!-- Cracked Earth Cracks -->
        <path d="M220,580 L260,630 L240,680" stroke="#44403c" stroke-width="3" fill="none"/>
        <path d="M520,590 L560,620 L550,670" stroke="#44403c" stroke-width="3" fill="none"/>
        <path d="M840,580 L880,640 L910,670" stroke="#44403c" stroke-width="3" fill="none"/>

        <!-- Crushing Tax Stamp Block (Giant Roman Weight Pressing Down) -->
        <g id="tax-weight-block" transform="translate(640, 290)">
          <rect x="-180" y="-50" width="360" height="100" rx="10" fill="#7f1d1d" stroke="#ef4444" stroke-width="4"/>
          <text class="text-label" x="0" y="10" text-anchor="middle" fill="#ffffff" font-size="36">ROMAN TRIBUTE</text>
          <text class="text-label" x="0" y="34" text-anchor="middle" fill="#fca5a5" font-size="18">RELENTLESS TAXATION</text>
          <!-- Downward crushing force arrows -->
          <polygon points="-120,55 -100,55 -110,85" fill="#ef4444"/>
          <polygon points="120,55 100,55 110,85" fill="#ef4444"/>
        </g>

        <!-- Starving Judean Family / Population (Animated crowd generated via JS) -->
        <g id="starving-crowd-container"></g>

        <!-- Desperate Father pleading with empty grain bowl -->
        <g class="char-bob" transform="translate(340, 440) scale(1.2)">
          <rect x="26" y="58" width="13" height="46" rx="4" fill="#b45309"/>
          <rect x="42" y="58" width="13" height="46" rx="4" fill="#b45309"/>
          <!-- Tattered rag tunic -->
          <polygon points="18,24 60,24 54,66 22,66" fill="#57534e"/>
          <circle cx="39" cy="12" r="13" fill="#fed7aa"/>
          <circle cx="43" cy="11" r="2" fill="#000"/>
          <!-- Pleading outstretched arms with empty bowl -->
          <g class="walk-arm-r">
            <rect x="48" y="24" width="10" height="28" rx="4" fill="#57534e"/>
            <!-- Empty wooden bowl -->
            <ellipse cx="62" cy="50" rx="14" ry="7" fill="#78350f" stroke="#ca8a04"/>
          </g>
        </g>

        <!-- Titles -->
        <g transform="translate(640, 105)">
          <rect x="-310" y="-45" width="620" height="90" rx="16" fill="#000" opacity="0.85" stroke="#ef4444" stroke-width="2"/>
          <text class="text-label" x="0" y="2" text-anchor="middle" fill="#ef4444" font-size="38">POINT OF STARVATION</text>
          <text class="text-label" x="0" y="34" text-anchor="middle" fill="#ffffff" font-size="20">TAXED RELENTLESSLY INTO THE GROUND</text>
        </g>
      </g>

      <!-- ================= SCENE 3: [22.0s - 30.0s] ULTIMATE INSULT: WALKING INTO THE GREAT TEMPLE ================= -->
      <!-- Timed: [22.0-24.3s] committed what was seen, [24.3-27.3s] ultimate unforgivable insult, [27.3-28.9s] walked into the Great Temple -->
      <g class="scene" id="scene-3">
        <rect x="-100" y="-100" width="1480" height="920" fill="url(#templeSky)"/>
        <!-- Inside the Courtyard of the Second Temple of Jerusalem -->
        <g transform="translate(640, 360)">
          <!-- Grand Golden Sanctuary Facade -->
          <rect x="-380" y="-160" width="760" height="340" fill="#f8fafc" stroke="#ca8a04" stroke-width="6"/>
          <polygon points="-400,-160 0,-240 400,-160" fill="url(#templeSanctuary)"/>
          <!-- Great Golden Sanctuary Gate / Nicanor Doors -->
          <rect x="-90" y="-40" width="180" height="220" rx="10" fill="#fde047" stroke="#ca8a04" stroke-width="5"/>
          <!-- Golden Temple Menorah Silhouette inside -->
          <path d="M-40,60 Q-40,20 0,20 Q40,20 40,60 M-20,60 Q-20,35 0,35 Q20,35 20,60 M0,10 L0,80" fill="none" stroke="#b45309" stroke-width="5"/>
          <!-- Massive Marble Pillars -->
          <rect x="-320" y="-140" width="34" height="320" fill="#e2e8f0"/>
          <rect x="-200" y="-140" width="34" height="320" fill="#e2e8f0"/>
          <rect x="170" y="-140" width="34" height="320" fill="#e2e8f0"/>
          <rect x="290" y="-140" width="34" height="320" fill="#e2e8f0"/>
        </g>

        <!-- Polished Marble Temple Flagstones -->
        <path d="M-80,540 L1380,540 L1380,750 L-80,750 Z" fill="#e2e8f0"/>
        <line x1="-80" y1="620" x2="1380" y2="620" stroke="#94a3b8" stroke-width="4"/>

        <!-- The Roman Soldiers & Governor Striding Brazenly In (Violating Sacred Purity Laws) -->
        <g id="desecrator-squad" transform="translate(360, 420) scale(1.35)">
          <g class="walk-leg-l">
            <rect x="26" y="58" width="13" height="48" rx="4" fill="#fed7aa"/>
            <rect x="22" y="98" width="22" height="10" rx="3" fill="#78350f"/>
          </g>
          <g class="walk-leg-r">
            <rect x="44" y="58" width="13" height="48" rx="4" fill="#fed7aa"/>
            <rect x="40" y="98" width="22" height="10" rx="3" fill="#78350f"/>
          </g>
          <!-- Armor & Imperial Red Cloak -->
          <path d="M14,24 L22,66 L30,24 Z" fill="#991b1b"/>
          <rect x="22" y="24" width="38" height="40" rx="6" fill="#eab308"/>
          <!-- Helmet -->
          <circle cx="41" cy="12" r="14" fill="#fed7aa"/>
          <circle cx="46" cy="11" r="2.5" fill="#0f172a"/>
          <path d="M26,8 Q41,-8 56,8 L58,16 L24,16 Z" fill="#ca8a04"/>
          <path d="M22,-4 Q41,-18 60,-4 L56,2 L26,2 Z" fill="#dc2626"/>
          <!-- Sword drawn inside the sacred sanctuary -->
          <g class="florus-sword">
            <rect x="48" y="24" width="12" height="30" rx="4" fill="#fed7aa"/>
            <line x1="56" y1="46" x2="94" y2="30" stroke="#94a3b8" stroke-width="4"/>
            <polygon points="94,30 102,24 96,35" fill="#cbd5e1"/>
          </g>
          <g class="walk-arm-l">
            <rect x="18" y="24" width="12" height="30" rx="4" fill="#fed7aa"/>
            <rect x="6" y="18" width="22" height="48" rx="4" fill="#dc2626" stroke="#ca8a04"/>
          </g>
        </g>

        <!-- Judean Priests in Shock & Horror at the Gate (Right Side) -->
        <g class="char-bob" transform="translate(940, 430) scale(1.3)">
          <rect x="26" y="58" width="13" height="48" rx="4" fill="#f8fafc"/>
          <rect x="44" y="58" width="13" height="48" rx="4" fill="#f8fafc"/>
          <!-- High Priest / Levite Linen Robes & Ephod -->
          <rect x="20" y="24" width="40" height="44" rx="6" fill="#f8fafc"/>
          <rect x="24" y="28" width="32" height="32" fill="#3b82f6"/> <!-- Ephod breastplate -->
          <!-- Head with White Turban / Mitznefet -->
          <circle cx="40" cy="12" r="14" fill="#fed7aa"/>
          <ellipse cx="40" cy="2" rx="16" ry="8" fill="#f8fafc"/>
          <circle cx="36" cy="12" r="2.5" fill="#0f172a"/>
          <!-- Hands raised in absolute anguish & dismay -->
          <g class="walk-arm-l">
            <line x1="16" y1="28" x2="-10" y2="-4" stroke="#fed7aa" stroke-width="7" stroke-linecap="round"/>
          </g>
          <g class="walk-arm-r">
            <line x1="58" y1="28" x2="80" y2="-4" stroke="#fed7aa" stroke-width="7" stroke-linecap="round"/>
          </g>
        </g>

        <!-- Shockwave Warning Ring over Temple -->
        <circle cx="640" cy="380" r="260" fill="none" stroke="#ef4444" stroke-width="4" stroke-dasharray="14,10" opacity="0.7"/>

        <!-- Final Climax Banner -->
        <g transform="translate(640, 105)">
          <rect x="-330" y="-45" width="660" height="90" rx="16" fill="#000" opacity="0.9" stroke="#ef4444" stroke-width="3"/>
          <text class="text-label" x="0" y="2" text-anchor="middle" fill="#ef4444" font-size="38">THE ULTIMATE INSULT</text>
          <text class="text-label" x="0" y="34" text-anchor="middle" fill="#fef08a" font-size="20">MARCHING INTO THE HOLY TEMPLE (66 AD)</text>
        </g>
      </g>
    </g>
  </svg>

  <!-- Atmospheric Canvas Particles (Desert Dust, Embers, Sparkles) -->
  <canvas id="ambientCanvas" width="1280" height="720"></canvas>
</div>

<script>
  /* ================= Deterministic Starving Population Crowd (Rule 6 & 8b) ================= */
  let seed = 77123;
  function seededRand() {
    seed = (seed * 9301 + 49297) % 233280;
    return seed / 233280;
  }

  // Populate Scene 2 with 80 figures to represent the impoverished population
  const crowdContainer = document.getElementById("starving-crowd-container");
  const svgNS = "http://www.w3.org/2000/svg";
  const crowdCount = 80;

  for (let i = 0; i < crowdCount; i++) {
    const row = Math.floor(i / 20);
    const col = i % 20;
    const g = document.createElementNS(svgNS, "g");

    const x = 500 + (col * 36) - (row * 18) + (seededRand() * 6);
    const y = 490 + (row * 30) + (seededRand() * 4);
    const s = 0.44 + (row * 0.1);

    g.setAttribute("transform", `translate(${x}, ${y}) scale(${s})`);

    const head = document.createElementNS(svgNS, "circle");
    head.setAttribute("cx", "0");
    head.setAttribute("cy", "-24");
    head.setAttribute("r", "7");
    head.setAttribute("fill", "#fed7aa");

    const body = document.createElementNS(svgNS, "path");
    const colors = ["#44403c", "#57534e", "#292524", "#78716c", "#1c1917"];
    body.setAttribute("d", "M-10,0 L10,0 L7,-18 L-7,-18 Z");
    body.setAttribute("fill", colors[Math.floor(seededRand() * colors.length)]);

    // Lowered head in exhaustion
    const arms = document.createElementNS(svgNS, "line");
    arms.setAttribute("x1", "0");
    arms.setAttribute("y1", "-12");
    arms.setAttribute("x2", "6");
    arms.setAttribute("y2", "6");
    arms.setAttribute("stroke", "#fed7aa");
    arms.setAttribute("stroke-width", "3");

    g.appendChild(arms);
    g.appendChild(body);
    g.appendChild(head);
    crowdContainer.appendChild(g);
  }

  /* ================= Atmospheric Canvas Particles ================= */
  const canvas = document.getElementById("ambientCanvas");
  const ctx = canvas.getContext("2d");
  const PARTICLE_COUNT = 75;
  const particles = [];

  for (let i = 0; i < PARTICLE_COUNT; i++) {
    particles.push({
      x: seededRand() * 1280,
      y: seededRand() * 720,
      vx: 0.05 + seededRand() * 0.12,
      vy: -0.04 - seededRand() * 0.08,
      r: 1.2 + seededRand() * 2.2,
      alpha: 0.25 + seededRand() * 0.5
    });
  }

  /* ================= Deterministic Clock Function (Rule 5 & 8) ================= */
  // Merged short sentences into neighbouring scenes across exactly 30.0s (30,000ms):
  // Scene 0: [0.0s - 8.0s]   (0 - 8000ms)     Collapse: Successors lacked competence & couldn't hold it together
  // Scene 1: [8.0s - 15.6s]  (8000 - 15600ms) Greedy governors completely tone-deaf to culture
  // Scene 2: [15.6s - 22.0s] (15600 - 22000ms) Taxed people into ground / outright starvation
  // Scene 3: [22.0s - 30.0s] (22000 - 30000ms) Ultimate unforgivable insult: Walking into the Great Temple
  const scenes = [
    { id: "scene-0", start: 0,     end: 8000 },
    { id: "scene-1", start: 8000,  end: 15600 },
    { id: "scene-2", start: 15600, end: 22000 },
    { id: "scene-3", start: 22000, end: 30000 }
  ];

  const cameraRoot = document.getElementById("camera-root");
  const taxBlock = document.getElementById("tax-weight-block");
  const desecrators = document.getElementById("desecrator-squad");

  window.updateSceneTime = function(t_ms) {
    const t = Math.max(0, Math.min(30000, t_ms));
    const FADE = 400; // 0.4s clean crossfade

    // 1. Scene Visibility & Cross-fade (Deterministic)
    scenes.forEach(sc => {
      const el = document.getElementById(sc.id);
      if (!el) return;

      if (t < sc.start || t > sc.end) {
        el.style.display = "none";
        el.style.opacity = 0;
      } else {
        el.style.display = "inline";
        let opacity = 1;
        if (t - sc.start < FADE && sc.start !== 0) {
          opacity = (t - sc.start) / FADE;
        } else if (sc.end - t < FADE && sc.end !== 30000) {
          opacity = (sc.end - t) / FADE;
        }
        el.style.opacity = opacity;
      }
    });

    // 2. Slow Cinematic Camera Pan / Zoom across 30 seconds
    const progress = t / 30000;
    const camX = -progress * 46;
    const camY = Math.sin(progress * Math.PI) * -10;
    const camScale = 1.0 + (progress * 0.045);
    cameraRoot.setAttribute("transform", `translate(${camX}, ${camY}) scale(${camScale})`);

    // 3. Scene-Specific Deterministic Logic
    // Scene 2: Tax Weight Crushing Downward
    if (taxBlock && t >= 15600 && t <= 22000) {
      const crushProgress = (t - 15600) / 6400;
      const crushY = crushProgress * 65;
      taxBlock.setAttribute("transform", `translate(640, ${290 + crushY})`);
    }

    // Scene 3: Roman Desecrators Striding Inward into the Temple
    if (desecrators && t >= 22000) {
      const marchProgress = (t - 22000) / 8000;
      const marchX = 360 + marchProgress * 120;
      desecrators.setAttribute("transform", `translate(${marchX}, 420) scale(1.35)`);
    }

    // 4. Atmospheric Canvas Particles
    ctx.clearRect(0, 0, 1280, 720);
    for (let i = 0; i < PARTICLE_COUNT; i++) {
      const p = particles[i];
      const px = (p.x + t * p.vx) % 1280;
      const py = (p.y + t * p.vy + 720000) % 720;
      const shimmer = Math.sin(t * 0.004 + i) * 1.5;

      // Color tints: gold coins in scene 1, ash in scene 2, crimson fury in scene 3
      ctx.fillStyle = (t >= 22000) ? "#ef4444" : ((t >= 8000 && t <= 15600) ? "#fde047" : "#cbd5e1");
      ctx.globalAlpha = p.alpha * (0.6 + 0.4 * Math.sin(t * 0.003 + i));
      ctx.beginPath();
      ctx.arc(px + shimmer, py, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
  };

  // Initial render at t = 0
  window.updateSceneTime(0);
</script>
</body>
