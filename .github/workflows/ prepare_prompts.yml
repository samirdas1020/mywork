name: Prepare Prompts (No API)

on:
  workflow_dispatch:
    inputs:
      drive_url:
        description: 'Google Drive audio link (shared: Anyone with the link)'
        required: true
        type: string

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install faster-whisper pydub gdown
      - name: Download Audio from Drive
        env:
          DRIVE_URL: ${{ inputs.drive_url }}
        run: |
          gdown --fuzzy "$DRIVE_URL" -O input_audio.mp3
          ls -lh input_audio.mp3
      - name: Split Audio, Transcribe & Build Prompts
        env:
          PYTHONUNBUFFERED: "1"
        run: python -u prepare_prompts.py
      - name: Upload Prompts Package
        uses: actions/upload-artifact@v4
        with:
          name: prompts-package
          path: prompts_output/
