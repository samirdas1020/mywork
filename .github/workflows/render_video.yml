name: Render Video (No API)

on:
  workflow_dispatch:

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.p.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        name: Find scene files
        run: |
          idx=$(ls render_input/scene_*.html | sed -E 's/.*scene_([0-9]+)\.html/\1/' | sort -n | jq -R . | jq -sc .)
          echo "Scenes found: $idx"
          echo "matrix=$idx" >> $GITHUB_OUTPUT

  render:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        chunk: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: |
          pip install playwright
          playwright install --with-deps chromium
          ffmpeg -version | head -1
      - name: Render Chunk
        env:
          PYTHONUNBUFFERED: "1"
        run: python -u render_scenes.py render ${{ matrix.chunk }}
      - uses: actions/upload-artifact@v4
        with:
          name: clip-${{ matrix.chunk }}
          path: clips/synced_${{ matrix.chunk }}.mp4

  merge:
    needs: render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: clip-*
          merge-multiple: true
          path: clips
      - name: Merge Clips
        run: python render_scenes.py merge
      - uses: actions/upload-artifact@v4
        with:
          name: final-video
          path: final_video.mp4
